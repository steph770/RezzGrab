<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReciGrab</title>
<meta name="theme-color" content="#24382C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Courier+Prime:wght@400;700&family=Archivo+Narrow:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Aussehen: Karteikasten (Standard) oder Klassisch
  try { document.documentElement.dataset.design = localStorage.getItem('rg-design') === 'klassisch' ? 'klassisch' : 'kartei'; }
  catch (e) { document.documentElement.dataset.design = 'kartei'; }
</script>
<style>
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --ink:#1C2620; --muted:#636D66; --line:#DBE0D8;
  --herb:#2E5A3F; --herb-ink:#FFFFFF; --herb-soft:#DCE8DF;
  --saffron:#D9961C; --saffron-soft:#FAE9C4; --saffron-ink:#5A3D05;
  --danger:#B0412D;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121815; --surface:#1B231E; --ink:#E8EDE7; --muted:#97A39A; --line:#2C3830;
    --herb:#8DC3A0; --herb-ink:#0F1A13; --herb-soft:#21342A;
    --saffron:#F0B84A; --saffron-soft:#3A2E14; --saffron-ink:#F7DFA8;
    --danger:#E5806A;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kopf der Liste */
.masthead{padding:28px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wordmark{margin:0;font-size:44px;line-height:.9;font-weight:800;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.wordmark span{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:8px}
.searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-size:16px}
.searchbox input:focus{border-color:var(--herb);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Feed */
.feed{display:grid;gap:26px;padding-top:6px}
.card{display:block;text-decoration:none;color:inherit}
.thumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;bottom:10px;background:rgba(15,20,17,.78);color:#fff;font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px}
.card h2{font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:12px 0 3px}
.card .meta{color:var(--muted);font-size:14px;margin:0}
.minitags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.minitag{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--herb-soft);color:var(--ink)}
.state{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  background:linear-gradient(to top,rgba(12,16,14,.86),rgba(12,16,14,.15));color:#fff}
.state strong{font-size:17px}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:40%;background:var(--saffron);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%;opacity:.6}}
.rowbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.empty{padding:40px 4px;text-align:left}
.empty h2{font-size:26px;line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.empty p{color:var(--muted);margin:0 0 8px;max-width:46ch}

/* Buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--herb-soft);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--herb);color:var(--herb-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);z-index:20;
  background:var(--saffron);color:#231803;border:0;border-radius:18px;padding:15px 20px;font-weight:700;font-size:16px;
  box-shadow:0 8px 24px rgba(60,40,0,.28);cursor:pointer}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;max-width:200px;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:13px;color:var(--muted);font-weight:600}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--herb)}
.tabs .count{background:var(--saffron);color:#231803;border-radius:999px;font-size:11px;padding:0 6px;margin-left:3px}

/* Detail */
.hero{position:relative;margin:0 -16px;aspect-ratio:16/9;background:var(--line);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;width:42px;height:42px;border-radius:50%;
  background:rgba(15,20,17,.7);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:24px}
.dtitle{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:18px 0 6px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:15px;align-items:center}
.dmeta a{color:var(--herb);font-weight:600;text-decoration:none}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.notice{background:var(--saffron-soft);color:var(--saffron-ink);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:16px 0 0}
.servings{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.servings button{width:48px;height:48px;border-radius:12px;border:0;background:var(--herb-soft);font-size:26px;font-weight:600;cursor:pointer}
.servings .val{text-align:center}
.servings .val strong{display:block;font-size:28px;line-height:1;font-weight:800}
.servings .val span{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.section-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:30px 0 10px}
.group-h{font-size:15px;font-weight:700;color:var(--muted);margin:16px 0 4px}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16.5px}
.ings .amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ings .note{color:var(--muted);font-size:14.5px}
.ings .amt.est{color:var(--muted)}
.ing.est{background:transparent;border:1.5px dashed var(--saffron)}
.thumbpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.thumbpick button{border:3px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:var(--line);aspect-ratio:16/9;cursor:pointer}
.thumbpick button[aria-pressed="true"]{border-color:var(--saffron)}
.thumbpick img{width:100%;height:100%;object-fit:cover;display:block}
.ings .missing{color:var(--saffron-ink);background:var(--saffron-soft);font-size:12.5px;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.steps{list-style:none;counter-reset:s;margin:0;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);font-weight:800;font-size:22px;color:var(--herb);line-height:1.2}
.steps p{margin:0;font-family:var(--read);font-size:18px;line-height:1.6}
.steps li.done p{opacity:.45}
.ing{background:var(--saffron-soft);color:var(--saffron-ink);border-radius:6px;padding:0 5px;font-family:var(--display);font-weight:650;font-size:16.5px;white-space:nowrap}
.ts{display:inline-block;margin-top:6px;font-size:13.5px;color:var(--herb);font-weight:600;text-decoration:none}
.tips{font-family:var(--read);font-size:17px;line-height:1.6;background:var(--surface);border-left:4px solid var(--saffron);border-radius:0 12px 12px 0;padding:12px 16px;margin:0}
.foot{margin:34px 0 10px;display:flex;gap:8px;flex-wrap:wrap}
.cost{color:var(--muted);font-size:13px;margin:8px 0 0}

/* Einkauf */
.pagetitle{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:28px 0 6px;line-height:1}
.sub{color:var(--muted);margin:0 0 14px}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.shop input[type=checkbox]{width:24px;height:24px;accent-color:var(--herb);flex:none}
.shop label{flex:1;display:flex;gap:10px;align-items:baseline;cursor:pointer}
.shop .amt{font-weight:700;min-width:70px;font-variant-numeric:tabular-nums}
.shop .from{display:block;font-size:12.5px;color:var(--muted)}
.shop li.checked label{opacity:.45;text-decoration:line-through}
.addrow{display:flex;gap:8px;margin:14px 0}
.addrow input{flex:1}

/* Formulare */
.field{display:block;margin:14px 0}
.field > span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.inp, .field input, .field textarea, .field select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px 16px;margin:16px 0}
.panel h3{font-size:18px;margin:14px 0 4px}
.ed-ing{display:grid;grid-template-columns:64px 64px 1fr 36px;gap:6px;margin:6px 0;align-items:center}
.ed-ing input{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:15px;width:100%;min-width:0}
.ed-ing .x{border:0;background:transparent;font-size:22px;color:var(--danger);cursor:pointer}
.ed-step{margin:10px 0}
.ed-step textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:15px;min-height:64px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.status{font-size:14px;margin-top:8px}
.ok{color:var(--herb)} .err{color:var(--danger)}

/* Dialog und Toast */
dialog{border:0;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,12,.55)}
dialog h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
dialog p{color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:50;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Filter */
.filterline{display:flex;align-items:center;gap:16px;margin:2px 0 12px}
.filtertoggle{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px 9px 16px;font-weight:600;font-size:15px;cursor:pointer}
.filtertoggle svg{width:18px;height:18px;transition:transform .2s}
.filtertoggle[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filtertoggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.linkbtn{border:0;background:none;color:var(--herb);font-weight:600;font-size:15px;padding:6px 2px;cursor:pointer}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 14px;margin:0 0 14px}
.frow{padding:6px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:0}
.flabel{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.fpanel .chips{padding:2px 0 4px;margin:0;flex-wrap:wrap;overflow:visible}
.fpanel .rowbtns{margin-top:10px}
/* Platzhalter ohne Bild */
.ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:16px;background:var(--herb);color:var(--herb-ink)}
.ph span{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .ph span{font-size:34px}
/* Dialog */
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* Originalseiten */
.pages{margin:30px 0 0}
.pages summary{font-size:18px;font-weight:700;cursor:pointer;padding:6px 0}
.pages .pg{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pages .pg img{display:block;width:100%;margin:0;border:0}

/* Kachelraster */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:2px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid > .card,.grid > .empty{grid-column:1/-1}
.grid > .card{margin-bottom:8px}
.tile{position:relative;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line);color:#fff;text-decoration:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--fx,50%) var(--fy,50%);pointer-events:none;-webkit-user-drag:none}
.tile img.lb{transform:scale(1.3334);transform-origin:var(--fx,50%) 50%}
.tile::after{content:"";position:absolute;inset:36% 0 0;background:linear-gradient(to top,rgba(8,12,10,.86),rgba(8,12,10,.46) 55%,rgba(8,12,10,0));pointer-events:none}
.tile .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 10px 9px;display:flex;flex-direction:column;gap:3px}
.tile .cap b{font-size:13.5px;line-height:1.2;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;hyphens:auto;overflow-wrap:break-word}
.tile .cap small{font-size:11.5px;line-height:1.25;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .src{position:absolute;top:7px;left:7px;z-index:2;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(8,12,10,.5);color:#fff}
.tile .src svg{width:12px;height:12px}
.tile .tbadge{position:absolute;top:7px;right:7px;z-index:2;font-size:11px;line-height:1;font-weight:700;padding:5px 7px;border-radius:999px;background:rgba(8,12,10,.5);color:#fff;white-space:nowrap}
.tile.tt{background:var(--tc);color:var(--tf)}
.tile.tt::after{display:none}
.tile.tt .cap{padding:12px}
.tile.tt .cap b{font-size:18px;line-height:1.12;font-weight:800;letter-spacing:-.01em;-webkit-line-clamp:5}
.tile.tt .cap small{opacity:.78}
.tile.tt .src,.tile.tt .tbadge{background:rgba(0,0,0,.14);color:var(--tf)}
.hero img{object-position:var(--fx,50%) var(--fy,50%)}
.hero.slim{aspect-ratio:auto;height:calc(env(safe-area-inset-top) + 88px);background:var(--tc)}
/* Kachel-Einstellungen */
.seg{display:flex;gap:6px;margin:6px 0 14px}
.seg button{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 6px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:default}
.tdhead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.tdhead h2{font-size:20px;line-height:1.15;margin:0}
.tdprev{width:104px;flex:none}
.tdprev .tile{width:172px;zoom:.6047}
.kachel{display:flex;gap:16px;align-items:flex-start;margin:8px 0 6px}
.kprev{width:128px;flex:none}
.kprev .tile{width:172px;zoom:.7442}
.kopts{flex:1;min-width:0}
.kopts input[type=range]{width:100%;accent-color:var(--herb);margin:8px 0 0}
/* Vorschaubild aus Screenshot wählen */
#cropdlg{max-height:100dvh;overflow-y:auto}
#cropdlg h2{margin:0 0 4px}
.cropvp{width:100%;max-width:400px;margin:10px auto 8px;touch-action:none;cursor:grab;background:#1b1f1d}
.cropvp .cstage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.cropvp .cstage img{inset:auto;position:absolute;left:0;object-fit:fill;max-width:none;pointer-events:none}
.csrc{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.csrc button{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:3px solid transparent;padding:0;background:var(--line);cursor:pointer}
.csrc button[aria-pressed="true"]{border-color:var(--saffron)}
.csrc img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cropzoom{width:100%;accent-color:var(--herb);margin:4px 0 10px}

/* ===================== Aussehen: Karteikasten ===================== */
.tile .tab,.tile .tape{display:none}
html[data-design="kartei"]{
  color-scheme:light;
  --bg:#D7DED9; --surface:#FFFDF9; --ink:#1D1F1E; --muted:#5B615D; --line:#C7D0CA;
  --herb:#2E5A8C; --herb-ink:#FFFFFF; --herb-soft:#E3EAF2;
  --saffron:#B6403A; --saffron-soft:#F6E27A; --saffron-ink:#1D1F1E; --danger:#B6403A;
  --display:"Work Sans", system-ui, sans-serif; --read:"Courier Prime", ui-monospace, monospace;
  --type:"Courier Prime", ui-monospace, monospace; --tape:"Archivo Narrow", system-ui, sans-serif;
}
html[data-design="kartei"] body{font-family:var(--display)}
/* Kopf: Prägeband */
[data-design="kartei"] .masthead{padding:26px 0 40px}
[data-design="kartei"] .wordmark{position:relative;display:inline-block;background:#1D1F1E;color:#F4F4F0;font-family:var(--tape);font-weight:700;font-size:30px;letter-spacing:6px;text-transform:uppercase;padding:8px 16px 8px 20px;border-radius:4px;transform:rotate(-1.5deg);box-shadow:0 2px 0 #000;line-height:1}
[data-design="kartei"] .wordmark span{position:absolute;left:2px;top:calc(100% + 12px);white-space:nowrap;color:var(--ink);font-family:var(--type);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;transform:rotate(1.5deg);margin:0}
[data-design="kartei"] .pagetitle{display:inline-block;background:#1D1F1E;color:#F4F4F0;font-family:var(--tape);font-weight:700;letter-spacing:4px;text-transform:uppercase;font-size:24px;padding:8px 14px;border-radius:4px;transform:rotate(-1deg);box-shadow:0 2px 0 #000;margin-bottom:14px}

[data-design="kartei"] .fpanel,[data-design="kartei"] .panel,[data-design="kartei"] dialog{border-radius:6px;border:0;box-shadow:0 1px 0 #B9C1BB,0 6px 14px rgba(30,40,34,.12)}
[data-design="kartei"] .chip{border-radius:3px;border:1.5px dashed #6E7570;font-family:var(--tape);font-weight:600;letter-spacing:.5px}
[data-design="kartei"] .chip[aria-pressed="true"]{background:#1D1F1E;color:#F4F4F0;border:1.5px solid #1D1F1E}
[data-design="kartei"] .flabel,[data-design="kartei"] .section-h,[data-design="kartei"] .group-h{font-family:var(--tape);text-transform:uppercase;letter-spacing:2px}
[data-design="kartei"] .btn{border-radius:3px;font-family:var(--tape);font-weight:700;letter-spacing:1px}
[data-design="kartei"] .btn.ghost{border:1.5px solid #6E7570}

[data-design="kartei"] .tabs{font-family:var(--type)}
[data-design="kartei"] .tabs a[aria-current="page"] span,[data-design="kartei"] .tabs a[aria-current="page"]{text-decoration:underline;text-decoration-color:#E39B9B;text-underline-offset:5px;text-decoration-thickness:2px}

/* Kacheln als Karteikarten */
[data-design="kartei"] .grid{gap:28px 12px;padding-top:18px}
[data-design="kartei"] .tile:not(.cropvp){aspect-ratio:auto;overflow:visible;background:var(--surface);color:var(--ink);border-radius:4px;padding:10px 10px 12px;box-shadow:0 1px 0 #B9C1BB,0 6px 14px rgba(30,40,34,.12);transform:rotate(-.8deg)}
[data-design="kartei"] .grid .tile:nth-child(even){transform:rotate(.9deg)}
[data-design="kartei"] .grid .tile:nth-child(3n){transform:rotate(.35deg)}
[data-design="kartei"] .tile:not(.cropvp)::after{display:none}
[data-design="kartei"] .tile:not(.cropvp) img{position:relative;inset:auto;display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:2px;transform:none}
[data-design="kartei"] .tile:not(.cropvp) .tape{display:block;position:absolute;top:2px;left:50%;width:46px;height:16px;margin-left:-23px;background:rgba(240,232,200,.88);transform:rotate(-4deg);z-index:3}
[data-design="kartei"] .tile:not(.cropvp) .tab{display:block;position:absolute;top:-16px;left:10px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--tc,#4A5862);color:#FFFFFF;font-family:var(--tape);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px 6px;border-radius:4px 4px 0 0}
[data-design="kartei"] .tile:not(.cropvp) .cap{position:static;padding:9px 0 0;color:var(--ink);gap:5px}
[data-design="kartei"] .tile:not(.cropvp) .cap b{font-family:var(--type);font-size:14px;line-height:1.2;font-weight:700}
[data-design="kartei"] .tile:not(.cropvp) .cap small{font-size:11px;color:var(--muted);opacity:1;border-top:1px solid #C7D7E6;padding-top:5px}
[data-design="kartei"] .tile:not(.cropvp) .src{top:16px;left:16px;background:rgba(29,31,30,.6);color:#FFFFFF}
[data-design="kartei"] .tile.tt:not(.cropvp) .src{top:10px;left:8px;background:transparent;color:var(--muted)}
[data-design="kartei"] .tile:not(.cropvp) .tbadge{top:12px;bottom:auto;right:12px;width:42px;height:42px;padding:0;border-radius:50%;border:2px solid #B6403A;background:rgba(255,253,249,.92);color:#B6403A;font-family:var(--tape);font-size:10px;line-height:1.05;white-space:normal;text-align:center;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
[data-design="kartei"] .tile.tt:not(.cropvp){background:var(--surface);color:var(--ink)}
[data-design="kartei"] .tile.tt:not(.cropvp) .cap{padding-top:22px;min-height:96px;justify-content:flex-end}
[data-design="kartei"] .tile.tt:not(.cropvp) .cap b{font-size:18px;-webkit-line-clamp:5}
/* Rezept als Karteikarte */
[data-design="kartei"] article{position:relative;background-color:var(--surface);border-radius:6px;padding:16px 14px 20px 34px;margin:12px -6px 24px;box-shadow:0 1px 0 #B9C1BB,0 6px 14px rgba(30,40,34,.12)}
[data-design="kartei"] article::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1.5px;background:#E39B9B}
[data-design="kartei"] .hero{margin:4px 0 0 -18px;border:8px solid #FFFFFF;border-radius:3px;transform:rotate(-1.2deg);box-shadow:0 8px 18px rgba(30,40,34,.22);overflow:visible}
[data-design="kartei"] .hero::before{content:"";position:absolute;top:-16px;left:42%;width:72px;height:22px;background:rgba(240,232,200,.88);transform:rotate(3deg);z-index:2}
[data-design="kartei"] .hero img{display:block;width:100%;height:100%;object-fit:cover}
[data-design="kartei"] .hero.slim{height:64px;border:0;transform:none;box-shadow:none;margin:0 0 0 -18px;background:transparent}
[data-design="kartei"] .hero.slim::before{display:none}
[data-design="kartei"] .back{top:8px;left:8px;width:auto;height:auto;padding:8px 12px;border-radius:3px;background:#1D1F1E;font-family:var(--tape);font-weight:700;font-size:13px;letter-spacing:2px}
[data-design="kartei"] .back::after{content:"KASTEN";margin-left:6px}
[data-design="kartei"] .dtitle{font-family:var(--type);font-weight:700;font-size:26px;letter-spacing:0;line-height:1.1}
[data-design="kartei"] .dmeta{font-size:13px}
[data-design="kartei"] .section-h{font-size:14px;color:var(--muted);margin:26px 0 4px}
[data-design="kartei"] .minitag{background:#1D1F1E;color:#F4F4F0;font-family:var(--tape);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-radius:2px;padding:3px 8px}
[data-design="kartei"] .notice{background:#F6E27A;color:#1D1F1E;border-radius:2px;font-family:var(--type);font-size:14px;transform:rotate(-.6deg);box-shadow:0 4px 10px rgba(30,40,34,.15)}
[data-design="kartei"] .servings{background:transparent;border:0;padding:0;font-family:var(--type)}
[data-design="kartei"] .servings button{background:transparent;border:1.5px solid #1D1F1E;border-radius:3px;width:44px;height:44px}
[data-design="kartei"] .servings .val strong{font-family:var(--type);font-size:24px}
[data-design="kartei"] .ings,[data-design="kartei"] .steps,[data-design="kartei"] .tips{--rule:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#C9DAEA 27px,#C9DAEA 28px);background-image:var(--rule);background-position:0 0;line-height:28px}
[data-design="kartei"] .ings li{border-bottom:0;padding:0;line-height:28px;font-family:var(--type);font-size:15px;grid-template-columns:84px 1fr;gap:0 12px}
[data-design="kartei"] .ings .note,[data-design="kartei"] .ings .missing{line-height:inherit}
[data-design="kartei"] .ings .missing{background:transparent;color:#B6403A;border:1px solid #B6403A;font-family:var(--tape)}
[data-design="kartei"] .steps li{border-bottom:0;padding:0;margin:0;grid-template-columns:28px 1fr;line-height:28px}
[data-design="kartei"] .steps li > div{line-height:28px}
[data-design="kartei"] .steps li::before{font-family:var(--type);color:#B6403A;font-size:17px;line-height:28px}
[data-design="kartei"] .steps p{font-family:var(--type);font-size:15.5px;line-height:28px}
[data-design="kartei"] .ing{background:#F6E27A;color:#1D1F1E;font-family:var(--type);font-weight:700;font-size:15px;border-radius:1px;line-height:inherit;white-space:normal}
[data-design="kartei"] .ing.est{background:transparent;border:1.5px dashed #B6403A}
[data-design="kartei"] .tips{background-color:transparent;border-left:3px solid #B6403A;border-radius:0;padding:0 0 0 12px;font-family:var(--type);font-size:15px}
[data-design="kartei"] .ts{display:block;margin:0;line-height:28px;font-family:var(--tape);letter-spacing:.5px;color:var(--herb)}
</style>
</head>
<body>
<main id="view" class="wrap" aria-live="polite"></main>

<button class="fab" id="fab" type="button">+ Rezept holen</button>

<nav class="tabs" aria-label="Hauptnavigation">
  <a href="#/" data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M10 8.2v3.6L13 10z" fill="currentColor"/><path d="M7 20h10"/></svg>
    Rezepte</a>
  <a href="#/einkauf" data-tab="shop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.3 11.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
    <span>Einkauf<span class="count" id="shopcount" hidden></span></span></a>
  <a href="#/einstellungen" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    Einstellungen</a>
</nav>

<dialog id="adddlg">
  <h2>Rezept hinzufügen</h2>
  <p>Am schnellsten über Teilen: Video aus der YouTube-App, Screenshots oder Fotos an ReciGrab schicken.</p>
  <label class="field"><span>YouTube-Link</span><input id="addurl" type="url" inputmode="url" placeholder="https://youtu.be/..." autocomplete="off"></label>
  <div class="rowbtns">
    <button class="btn primary" type="button" id="urlgo">Rezept holen</button>
    <button class="btn ghost" type="button" id="pastebtn">Aus Zwischenablage</button>
  </div>
  <div class="or"><span>oder</span></div>
  <div class="rowbtns">
    <label class="btn" for="photoin">Fotos oder Screenshots</label>
    <input id="photoin" type="file" accept="image/*" multiple hidden>
    <label class="btn" for="videoin">Video</label>
    <input id="videoin" type="file" accept="video/*" hidden>
    <button class="btn" type="button" id="texttoggle">Text einfügen</button>
  </div>
  <div id="textbox" hidden>
    <label class="field"><span>Rezepttext</span><textarea id="addtext" rows="7" placeholder="Zutaten und Zubereitung hier einfügen"></textarea></label>
    <button class="btn primary" type="button" id="textgo">Rezept erkennen</button>
  </div>
  <div class="rowbtns" style="margin-top:16px"><button class="btn ghost" type="button" id="dlgclose">Schließen</button></div>
</dialog>

<dialog id="tiledlg"><div id="tdbody"></div></dialog>
<dialog id="cropdlg"><div id="cropbody"></div></dialog>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ---------- Konstanten ---------- */
const APP_VERSION = '2.9 vom 22.10.2026';
const DEFAULT_MODEL = 'google/gemini-3.8-flash';
const TAXONOMY = {
  Quelle: ['Youtube', 'Instagram', 'Buch', 'Zeitung', 'Blog'],
  Kochdauer: ['bis 30 Min', 'bis 60 Min', 'über 60 Min'],
  Gang: ['Vorspeise', 'Suppe', 'Salat', 'Hauptgericht', 'Beilage', 'Dessert'],
  Hauptzutat: ['Gemüse', 'Hülsenfrüchte', 'Pasta, Reis & Getreide', 'Ei & Käse', 'Fisch & Meeresfrüchte', 'Geflügel', 'Fleisch'],
  Aufwand: ['Alltag', 'Projekt'],
  'Ernährung': ['vegetarisch'],
};
const ALL_TAGS = Object.values(TAXONOMY).flat();
const catOf = (t) => Object.keys(TAXONOMY).find((c) => TAXONOMY[c].includes(t));
const OLD_TAGS = { main: 'Hauptgericht', salad: 'Salat', dessert: 'Dessert', side: 'Beilage', soup: 'Suppe', starter: 'Vorspeise' };
const timeTag = (t) => (t ? (t <= 30 ? 'bis 30 Min' : t <= 60 ? 'bis 60 Min' : 'über 60 Min') : null);
const timeBadge = (t) => (t ? (t <= 30 ? '≤ 30 Min' : t <= 60 ? '≤ 60 Min' : '> 60 Min') : '');
// "bis 60 Min" schließt beim Filtern die schnelleren Rezepte mit ein
const timeMatch = (m, tag) => (!m ? false : tag === 'bis 30 Min' ? m <= 30 : tag === 'bis 60 Min' ? m <= 60 : m > 60);

/* Farben der Titelkacheln nach Hauptzutat: [Hintergrund, Schrift] */
const TILE_COLORS = {
  'Gemüse': ['#3E7A4B', '#FFFFFF'],
  'Hülsenfrüchte': ['#6B4A7A', '#FFFFFF'],
  'Pasta, Reis & Getreide': ['#956619', '#FFFFFF'],
  'Ei & Käse': ['#E8C24A', '#2B2206'],
  'Fisch & Meeresfrüchte': ['#2C6488', '#FFFFFF'],
  'Geflügel': ['#B35C25', '#FFFFFF'],
  'Fleisch': ['#9C3030', '#FFFFFF'],
};
const TILE_DEFAULT = ['#4A5862', '#FFFFFF'];

/* Eigene, schlichte Quellensymbole */
const ICONS = {
  video: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  zeitung: '<rect x="3.5" y="4.5" width="13" height="15" rx="1.5"/><path d="M16.5 8.5h3v9a2 2 0 0 1-2 2h-1M7 8.5h6M7 12h6M7 15.5h4"/>',
  buch: '<path d="M3.5 5.5c2.8-1 5.8-.8 8.5 1 2.7-1.8 5.7-2 8.5-1v13c-2.8-1-5.8-.8-8.5 1-2.7-1.8-5.7-2-8.5-1z"/><path d="M12 6.5v13"/>',
  web: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 2.6 14.6 0 17M12 3.5c-2.6 2.4-2.6 14.6 0 17"/>',
  foto: '<rect x="3.5" y="7" width="17" height="12.5" rx="2"/><circle cx="12" cy="13.2" r="3.2"/><path d="M8.5 7l1.4-2.5h4.2L15.5 7"/>',
  text: '<path d="M5 6.5h14M5 10.5h14M5 14.5h10M5 18.5h7"/>',
};

const SYSTEM_PROMPT = 'Du extrahierst Kochrezepte aus Videos, Bildern und Texten. Du antwortest ausschließlich mit einem einzigen JSON-Objekt nach dem vorgegebenen Schema, ohne Markdown und ohne Text davor oder danach.';

function buildPrompt(kind) {
  const video = kind === 'youtube' || kind === 'clip', photo = kind === 'photo', web = kind === 'web', ig = kind === 'insta';
  const intro = {
    youtube: 'Schau dir das Video vollständig an (Bild, Ton, Einblendungen) und extrahiere die Rezepte.',
    clip: 'Schau dir das Video vollständig an (Bild, Ton, Einblendungen, eingeblendeter Text) und extrahiere die Rezepte. Es ist oft ein kurzes Video aus Instagram oder TikTok.',
    insta: 'Rufe die unten genannte Instagram-Seite mit dem Web-Abruf-Werkzeug ab, genau diese Adresse. Das Rezept steht meist in der Beschreibung des Beitrags. Verwende nur diese Beschreibung. Steht dort kein vollständiges Rezept, etwa nur ein Verweis auf Kommentare, Direktnachrichten oder einen Link in der Bio, oder lässt sich die Seite nicht abrufen, setze is_recipe = false und beschreibe das Problem in error in einem kurzen deutschen Satz.',
    photo: 'Die Bilder zeigen Rezepte: Fotos von Kochbuch- oder Zeitschriftenseiten oder Screenshots von Webseiten und Apps. Mehrere Bilder können zu einem Rezept gehören (z. B. Seite 1 und 2 oder mehrere Screenshots). Lange Screenshots kommen in mehreren Teilen, die sich am Rand leicht überschneiden: Übernimm Zutaten und Schritte aus diesen Überschneidungen nicht doppelt. Lies alles vollständig und extrahiere die Rezepte.',
    text: 'Unten steht ein Rezepttext, etwa von einer Webseite kopiert. Extrahiere daraus die Rezepte.',
    web: 'Rufe die unten genannte Seite mit dem Web-Abruf-Werkzeug ab, genau diese Adresse mit allen Parametern, und extrahiere das Rezept. Verwende nur den Inhalt dieser Seite. Lässt sich die Seite nicht abrufen oder zeigt sie statt des Rezepts nur einen Anmelde- oder Bezahlhinweis, setze is_recipe = false und beschreibe das Problem in error in einem kurzen deutschen Satz.',
  }[kind];
  return `${intro}

Mehrere Rezepte:
- Enthält die Quelle mehrere eigenständige Gerichte, lege für jedes einen eigenen Eintrag in recipes an.
- Komponenten, die zu einem Gericht gehören (Sauce, Dressing, Topping, Teig), bleiben Teil dieses Rezepts und werden über group gekennzeichnet.
${video ? '- part_start_s: Sekunde, an der der Teil zu diesem Rezept beginnt. hero_s: Sekunde, an der das fertige Gericht am besten zu sehen ist. Jeweils null, wenn unklar.' : ''}${photo ? '- dish_photo: Ist auf einem Bild ein Foto des fertigen Gerichts zu sehen, gib image an (Index des Bildes, 0 = erstes Bild) und box als Begrenzungsrahmen dieses Fotos [ymin, xmin, ymax, xmax] auf einer Skala von 0 bis 1000. Sonst null.' : ''}

Regeln pro Rezept:
- Alles auf Deutsch, auch Titel und Zutatennamen. Eigennamen von Gerichten dürfen bleiben.
- Metrische Einheiten. Rechne cups, oz, lb, sticks und fl oz in g (feste Zutaten) oder ml (Flüssigkeiten) um, °F in °C, inch in cm. Runde auf praxisnahe Werte.
- Erlaubte Einheiten: g, kg, ml, l, EL, TL, Stk, Prise, Bund, Zehe, Dose, Scheibe, Handvoll, Zweig, Blatt. Für ganze Stücke ohne Einheit nimm "Stk".
- servings: Anzahl Personen. Steht sie in der Quelle, übernimm sie mit servings_estimated = false. Sonst schätze sie realistisch aus den Mengen (Hauptgericht etwa 150 bis 250 g Hauptzutat pro Person) und setze servings_estimated = true.
- Mengen: Steht eine Menge in der Quelle${video ? ' (gesagt, eingeblendet oder sichtbar abgemessen)' : ''}, übernimm sie mit amount_estimated = false. Fehlt sie, schätze eine realistische Menge passend zu servings${video ? ' und zu dem, was im Video zu sehen ist' : ''}, und setze amount_estimated = true. Nur bei Salz, Pfeffer und Würzen "nach Geschmack" darf amount null bleiben, dann note = "nach Geschmack".
- total_time_min: Gesamtzeit in Minuten inklusive Ruhe-, Marinier-, Gär- und Backzeiten. Steht sie in der Quelle oder lässt sie sich aus genannten Einzelzeiten summieren, setze total_time_estimated = false. Sonst schätze sie realistisch aus den Arbeitsschritten und setze total_time_estimated = true.${video ? ' Die Länge des Videos ist keine Kochzeit.' : ''}
- ingredients: jede Zutat einmal, mit kurzer id ("z1", "z2", ...) und der Gesamtmenge. group nur bei Komponenten, sonst null. note für Zusätze wie "fein gehackt" oder "zimmerwarm", sonst null. pantry = true für Grundzutaten, die man meist zu Hause hat (Salz, Pfeffer, Zucker, Mehl, neutrales Öl, Olivenöl, Essig, Backpulver, getrocknete Gewürze), sonst false.
- steps: kurze, klare Arbeitsschritte in der richtigen Reihenfolge, im Imperativ. In uses stehen die Zutaten, die in diesem Schritt verwendet werden, jeweils mit der Menge, die in diesem Schritt verwendet wird (bei Aufteilung die Teilmenge, geschätzte Mengen sind erlaubt). Im text markierst du jede Verwendung mit {0}, {1}, ... (Index in uses). Die App ersetzt jeden Platzhalter durch "Menge Einheit Zutat". Beispiel: "{0} in einer Pfanne schmelzen." wird zu "50 g Butter in einer Pfanne schmelzen." Nenne die Zutat deshalb nicht zusätzlich im Text.${video ? ' timestamp_s: Sekunde im Video, an der der Schritt gezeigt wird, sonst null.' : ''}
- gang: genau einer aus ${TAXONOMY.Gang.join(', ')}, nach der Rolle im Menü. Unklar: null.
- hauptzutat: genau einer dieser Werte, wörtlich: ${TAXONOMY.Hauptzutat.map((x) => `"${x}"`).join(', ')}. Gemeint ist die Zutat, die das Gericht prägt. Bei Fleisch- oder Fischgerichten mit viel Gemüse zählt das Fleisch bzw. der Fisch. Passt nichts (z. B. Kuchen): null.
- aufwand: "Alltag" bei überschaubarer aktiver Arbeit und gängigen Techniken, gut unter der Woche machbar. "Projekt" bei vielen Komponenten, anspruchsvoller Technik oder langer aktiver Arbeit. Lange passive Zeiten (Schmoren, Gehen lassen) allein machen kein Projekt.
- vegetarisch: true nur, wenn keine Zutat Fleisch, Geflügel, Fisch, Meeresfrüchte, Fleischbrühe, Gelatine, Schmalz, Fischsauce, Sardellen oder Worcestershiresauce ist. Ei, Milchprodukte und Honig sind erlaubt. Eine optionale Fleischbeilage zählt als nicht vegetarisch. false, wenn eine solche Zutat vorkommt. Unklar: null.
${web ? '- image_url: Adresse des Hauptfotos des Gerichts auf der Seite (etwa aus og:image), sonst null.\n' : ''}${kind === 'youtube' || ig ? '' : '- quelle: "Instagram" für Instagram-Beiträge und -Videos (etwa erkennbar an einem eingeblendeten Instagram-Namen), "Buch" für Kochbuchseiten, "Zeitung" für Zeitungen, Zeitschriften und deren Apps oder Webseiten (z. B. NYT Cooking), "Blog" für sonstige Webseiten und Rezeptportale. Unklar: null.\n'}- tips: wichtige Hinweise zu Technik oder Varianten, höchstens drei kurze Sätze, sonst null.
- Ist gar kein Rezept enthalten, setze is_recipe = false und recipes = [].

Schema:
{"is_recipe": boolean, ${video ? '"channel": string|null (bei Instagram der Kontoname, wenn sichtbar), "video_duration_s": number|null' : '"source_name": string|null (Name des Buchs, der Zeitung, Webseite oder des Instagram-Kontos, wenn erkennbar)'}${web || ig ? ', "error": string|null' : ''},
 "recipes": [{"title": string, ${video ? '"part_start_s": number|null, "hero_s": number|null, ' : ''}${photo ? '"dish_photo": {"image": number, "box": [number, number, number, number]}|null, ' : ''}${web ? '"image_url": string|null, ' : ''}
   "servings": number, "servings_estimated": boolean, "total_time_min": number, "total_time_estimated": boolean,

}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function ytId(str) {
  if (!str) return null;
  const m = String(str).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^ ]*&)?v=|shorts\/|live\/|embed\/|v\/))([\w-]{11})/i);
  return m ? m[1] : null;
}
const yt = (id, f) => `https://i.ytimg.com/vi/${id}/${f}.jpg`;
/* thumb: 0 = Standardbild des Videos, 1-3 = automatische Standbilder von YouTube (ungefähr bei einem Viertel, der Hälfte und drei Vierteln) */
function thumbChain(id, n) {
  const base = [yt(id, 'maxresdefault'), yt(id, 'sddefault'), yt(id, 'hqdefault')];
  return n ? [yt(id, `maxres${n}`), yt(id, `sd${n}`), yt(id, `hq${n}`), ...base] : base;
}
const focusOf = (r) => num(r.focus) ?? 50;
function imgTag(r, extra = '', ctx = 'tile') {
  const fx = `--fx:${focusOf(r)}%`;
  if (r.image) return `<img ${extra} src="${ctx === 'hero' && r.hero ? r.hero : r.image}" style="${fx}" alt="">`;
  if (r.videoId) {
    const chain = thumbChain(r.videoId, r.thumb || 0);
    return `<img class="yt" ${extra} src="${chain[0]}" data-chain="${esc(chain.slice(1).join('|'))}" style="${fx}" alt="">`;
  }
  const page = r.pages?.[r.coverPage || 0] || r.input?.pages?.[0];
  if (page) return `<img ${extra} src="${page}" style="--fx:50%;--fy:0%" alt="">`;
  return '';
}
const hasImage = (r) => !!(r.image || r.videoId || r.pages?.length);
function tileModeOf(r) {
  if (!hasImage(r)) return 'title';
  if (r.tileMode) return r.tileMode;
  return r.kind === 'photo' && !r.image ? 'title' : 'image';
}
function tileColor(r) {
  const h = (r.tags || []).find((t) => catOf(t) === 'Hauptzutat');
  return TILE_COLORS[h] || TILE_DEFAULT;
}
function sourceOf(r) {
  const q = (r.tags || []).find((t) => catOf(t) === 'Quelle');
  if (q === 'Youtube' || (!q && r.kind === 'youtube')) return ['video', 'Video'];
  if (q === 'Instagram' || r.kind === 'insta' || (!q && r.kind === 'clip')) return ['video', q === 'Instagram' || r.kind === 'insta' ? 'Instagram' : 'Video'];
  if (q === 'Zeitung') return ['zeitung', 'Zeitung'];
  if (q === 'Buch') return ['buch', 'Buch'];
  if (q === 'Blog') return ['web', 'Webseite'];
  return r.kind === 'photo' ? ['foto', 'Foto'] : r.kind === 'web' ? ['web', 'Webseite'] : ['text', 'Text'];
}
function tileHtml(r, tag = 'a') {
  const mode = tileModeOf(r);
  const [bg, fg] = tileColor(r);
  const attrs = tag === 'a' ? `href="#/r/${r.id}" data-id="${r.id}" draggable="false"` : '';
  const tab = (r.tags || []).find((t) => catOf(t) === 'Gang') || (r.tags || []).find((t) => catOf(t) === 'Hauptzutat') || 'Rezept';
  return `<${tag} class="tile${mode === 'title' ? ' tt' : ''}" ${attrs} style="--tc:${bg};--tf:${fg}"><span class="tab">${esc(tab)}</span>${mode === 'image' ? `${imgTag(r, tag === 'a' ? 'loading="lazy"' : '')}<span class="tape"></span>` : ''}${tileChrome(r)}</${tag}>`;
}
function tileChrome(r) {

    <span class="src" role="img" aria-label="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[icon]}</svg></span>

    <span class="cap"><b>${esc(r.title)}</b>${r.channel ? `<small>${esc(r.channel)}</small>` : ''}</span>`;
}
// Breites Bild im Quadrat: Mittelpunkt des Gerichts (0-1) in eine Ausschnitt-Position (0-100) umrechnen
function focusFromCenter(c) {
  const w = 9 / 16;
  return Math.max(0, Math.min(100, Math.round((c - w / 2) / (1 - w) * 100)));
}
function pickFrame(t, dur) {
  if (t === null || t === undefined || !dur) return 0;
  const pos = [0.25, 0.5, 0.75].map((q) => Math.abs(q * dur - t));
  return pos.indexOf(Math.min(...pos)) + 1;
}
const videoUrl = (id, t) => `https://www.youtube.com/watch?v=${id}${t ? `&t=${Math.floor(t)}s` : ''}`;

function fmtTime(min, est) {
  if (!min) return '';
  const p = est ? '≈ ' : '';
  if (min < 60) return `${p}${Math.round(min)} Min.`;
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return p + (m ? `${h} Std. ${m} Min.` : `${h} Std.`);
}
function fmtStamp(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

/* Mengen: in Basiseinheit rechnen, schön ausgeben */
const FRACTIONS = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
const PLURAL = { Zehe: 'Zehen', Dose: 'Dosen', Scheibe: 'Scheiben', Zweig: 'Zweige', Blatt: 'Blätter', Prise: 'Prisen' };
function toBase(amount, unit) {
  const u = (unit || '').trim();
  if (u === 'kg') return [amount * 1000, 'g'];
  if (u === 'l') return [amount * 1000, 'ml'];
  return [amount, u];
}
function decimal(n, digits) { return String(Number(n.toFixed(digits))).replace('.', ','); }
function fmtAmount(amount, unit) {
  if (amount === null || amount === undefined || !isFinite(amount)) return '';
  let [n, u] = toBase(amount, unit);
  if ((u === 'g' || u === 'ml') && n >= 1000) { n = n / 1000; u = u === 'g' ? 'kg' : 'l'; return `${decimal(n, 2)} ${u}`; }
  let s;
  if (u === 'g' || u === 'ml') s = n < 10 ? decimal(n, 1) : n < 100 ? String(Math.round(n)) : String(Math.round(n / 5) * 5);
  else {
    const q = Math.round(n * 4) / 4;
    if (q === 0) s = decimal(n, 2);
    else {
      const whole = Math.floor(q), frac = Number((q - whole).toFixed(2));
      s = (whole ? String(whole) : '') + (FRACTIONS[frac] || '');
    }
  }
  if (n > 1 && PLURAL[u]) u = PLURAL[u];
  return u ? `${s} ${u}` : s;
}

/* Bilder verkleinern und Gericht-Foto ausschneiden */
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
/* Bilder für Gemini vorbereiten: volle Schärfe bis 1600 px Breite, lange Screenshots in
   Teile von höchstens 2000 px Höhe schneiden, die sich um 120 px überlappen (keine Zeile wird zerschnitten).
   join = Überlappung relativ zur Breite, damit die Originalseiten nahtlos angezeigt werden können. */
async function prepImageParts(blob, maxW = 1600, sliceH = 2000, overlap = 120) {
  const src = URL.createObjectURL(blob);
  try {
    const img = await loadImg(src);
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    const s = Math.min(1, maxW / w0);
    const W = Math.round(w0 * s), H = Math.round(h0 * s);
    const n = H <= sliceH * 1.15 ? 1 : Math.ceil((H - overlap) / (sliceH - overlap));
    const hEach = n === 1 ? H : Math.ceil((H + (n - 1) * overlap) / n);
    const parts = [];
    for (let k = 0; k < n; k++) {
      const y = k * (hEach - overlap), h = Math.min(hEach, H - y);
      const c = document.createElement('canvas'); c.width = W; c.height = h;
      c.getContext('2d').drawImage(img, 0, y / s, w0, h / s, 0, 0, W, h);
      parts.push({ url: c.toDataURL('image/jpeg', 0.85), join: k ? overlap / W : 0 });
    }
    return parts;
  } finally { URL.revokeObjectURL(src); }
}
/* Standbild aus einem Video (data:-URL) an Sekunde t holen, sonst aus der Mitte */
async function grabFrame(dataUrl, t) {
  const blob = await (await fetch(dataUrl)).blob();
  const src = URL.createObjectURL(blob);
  try {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('Video')); setTimeout(() => rej(new Error('Zeit')), 15000); });
    const dur = isFinite(v.duration) ? v.duration : 0;
    const target = clamp(t ?? dur / 2, 0, Math.max(0, dur - 0.2));
    await new Promise((res) => { v.onseeked = res; v.currentTime = target; setTimeout(res, 6000); });
    const s = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(src); }
}

/* Die gespeicherten Teile eines Screenshots wieder zu ganzen Bildern zusammensetzen (Gruppen) */
async function pageGroups(pages, joins) {
  const groups = [];
  for (let i = 0; i < pages.length; i++) {
    const img = await loadImg(pages[i]);
    const j = joins?.[i] || 0;
    if (!j || !groups.length) groups.push({ slices: [], W: img.naturalWidth, H: 0 });
    const g = groups[groups.length - 1];
    const off = g.slices.length ? g.H - Math.round(j * g.W) : 0;
    g.slices.push({ i, img, off, w: img.naturalWidth, h: img.naturalHeight });
    g.H = off + img.naturalHeight;
  }
  return groups;
}
/* Quadratischen Ausschnitt (Kachel) und Breitbild (Rezeptansicht) aus einer Gruppe rendern.
   sel: Mittelpunkt cx/cy und Kantenlänge s, alle relativ zur Bildbreite. heroBox: [x, y, w, h] in Pixeln */
function bakeSel(g, sel, heroBox) {
  const W = g.W, H = g.H;
  const S = Math.min(sel.s * W, W, H);
  const cx = sel.cx * W, cy = sel.cy * W;
  const x0 = clamp(cx - S / 2, 0, W - S), y0 = clamp(cy - S / 2, 0, H - S);
  const draw = (rx, ry, rw, rh, ow, oh) => {
    const c = document.createElement('canvas'); c.width = ow; c.height = oh;
    const ctx = c.getContext('2d'); const f = ow / rw;
    for (const sl of g.slices) {
      if (sl.off + sl.h < ry || sl.off > ry + rh) continue;
      ctx.drawImage(sl.img, -rx * f, (sl.off - ry) * f, sl.w * f, sl.h * f);
    }
    return c.toDataURL('image/jpeg', 0.85);
  };
  const t = Math.min(900, Math.round(S));
  const image = draw(x0, y0, S, S, t, t);
  let hx, hy, hw, hh;
  if (heroBox) [hx, hy, hw, hh] = heroBox;
  else { hh = S; hw = Math.min(W, S * 16 / 9); hx = clamp(cx - hw / 2, 0, W - hw); hy = y0; }
  const ow = Math.min(1280, Math.round(hw));
  const hero = draw(hx, hy, hw, hh, ow, Math.max(1, Math.round(ow * hh / hw)));
  return { image, hero };
}

/* ---------- Datenbank (IndexedDB) ---------- */
let _db;
function openDb() {
  if (!_db) _db = new Promise((res, rej) => {
    const r = indexedDB.open('rezeptfang', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('recipes', { keyPath: 'id' }); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
const p = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function os(name, mode = 'readonly') { return (await openDb()).transaction(name, mode).objectStore(name); }
const db = {
  all: async () => p((await os('recipes')).getAll()),
  one: async (id) => p((await os('recipes')).get(id)),
  put: async (r) => p((await os('recipes', 'readwrite')).put(r)),
  del: async (id) => p((await os('recipes', 'readwrite')).delete(id)),
  get: async (k) => p((await os('kv')).get(k)),
  set: async (k, v) => p((await os('kv', 'readwrite')).put(v, k)),
};
/* Geteilte Inhalte, die der Service Worker zwischengespeichert hat */
function inboxTake() {
  return new Promise((res) => {
    const r = indexedDB.open('rf-inbox', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', { autoIncrement: true });
    r.onerror = () => res([]);
    r.onsuccess = () => {
      const tx = r.result.transaction('items', 'readwrite'), st = tx.objectStore('items');
      const g = st.getAll();
      g.onsuccess = () => st.clear();
      tx.oncomplete = () => res(g.result || []);
      tx.onerror = () => res([]);
    };
  });
}

/* ---------- Zustand ---------- */
const state = { recipes: [], shopping: [], settings: { apiKey: '', model: DEFAULT_MODEL }, q: '', filter: {}, showFilter: false, servings: {}, done: {}, wake: null };

function migrateTags(r) {
  const out = new Set();
  for (const t of r.tags || []) {
    if (OLD_TAGS[t]) out.add(OLD_TAGS[t]);
    else if (ALL_TAGS.includes(t) && catOf(t) !== 'Kochdauer') out.add(t);
  }
  const tt = timeTag(r.totalTime); if (tt) out.add(tt);
  return ALL_TAGS.filter((t) => out.has(t));
}

async function load() {
  state.recipes = await db.all();
  state.shopping = (await db.get('shopping')) || [];
  state.settings = Object.assign({ apiKey: '', model: DEFAULT_MODEL }, (await db.get('settings')) || {});
  for (const r of state.recipes) {
    let changed = false;
    if (r.status === 'importing') {
      const job = await jobs.get(r.id).catch(() => null);
      const age = Date.now() - (r.startedAt || 0);
      // Ohne Auftrag im Hintergrund ist ein Import nach dem Neustart verloren, im Hintergrund nach spätestens 6 Minuten
      if ((!job && age > 15000) || (job?.status === 'running' && age > 6 * 60 * 1000)) {
        if (r.backup?.length) { await db.del(r.id); for (const b of r.backup) await db.put(b); state.recipes = await db.all(); continue; }
        r.status = 'error'; r.error = 'Import wurde unterbrochen. Versuch es noch einmal.'; changed = true;
      }
    }
    if (!r.kind) { r.kind = r.videoId ? 'youtube' : 'text'; changed = true; }
    if (r.status === 'ok' && !r.tagsV2) { r.tags = migrateTags(r); r.tagsV2 = true; changed = true; }
    if (changed) await db.put(r);
  }
  updateShopCount();
}
async function refresh() { state.recipes = await db.all(); render(); }
function updateShopCount() {
  const open = state.shopping.filter((i) => !i.checked).length;
  const el = $('#shopcount'); el.hidden = !open; el.textContent = open;
}

function apiError(status, text) {
  let msg = '';
  try { msg = JSON.parse(text)?.error?.message || ''; } catch (_) { msg = String(text).slice(0, 160); }
  const map = {
    401: 'Der OpenRouter-Schlüssel ist ungültig. Prüfe ihn in den Einstellungen.',
    402: 'Das OpenRouter-Guthaben ist aufgebraucht oder das Tageslimit erreicht.',
    403: 'Anfrage blockiert. Prüfe in der Guardrail, ob Gemini 3.8 Flash und Google AI Studio erlaubt sind.',
    404: 'Kein passender Anbieter gefunden. Videos werden nur über Google AI Studio verarbeitet.',
    408: 'Zeitüberschreitung beim Anbieter. Versuch es noch einmal.',
    timeout: 'Keine fertige Antwort nach 10 Minuten. Versuch es noch einmal.',
    413: 'Die Bilder sind zu groß. Versuch es mit weniger Bildern.',
    429: 'Zu viele Anfragen. Warte kurz und versuch es noch einmal.',
  };
  return (map[status] || `Fehler ${status}.`) + (msg ? ` (${msg})` : '');
}

const DROP_MSG = 'Die Verbindung ist während des Imports abgerissen. Bleib in ReciGrab und lass den Bildschirm an, bis die Karte fertig ist, dann noch einmal versuchen.';

function buildBody(input) {
  let parts;
  if (input.kind === 'youtube') parts = [{ type: 'video_url', video_url: { url: videoUrl(input.videoId) } }];
  else if (input.kind === 'photo') parts = input.pages.map((u) => ({ type: 'image_url', image_url: { url: u } }));
  else if (input.kind === 'web') parts = [{ type: 'text', text: `Seite: ${input.url}` }];
  else if (input.kind === 'insta') parts = [{ type: 'text', text: `Seite: ${input.fetchUrl}` }];
  else if (input.kind === 'clip') parts = [{ type: 'video_url', video_url: { url: input.video } }];
  else parts = [{ type: 'text', text: `Rezepttext:\n\n${input.text}` }];
  const body = {
    model: state.settings.model || DEFAULT_MODEL,
    messages: [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: [{ type: 'text', text: buildPrompt(input.kind) }, ...parts] },
    ],
    provider: { only: ['google-ai-studio'], allow_fallbacks: false },
    response_format: { type: 'json_object' },
    temperature: 0.2,
    max_tokens: 32000,
    reasoning: { effort: 'low' },
    usage: { include: true },
    stream: true,
  };
  if (input.kind === 'web' || input.kind === 'insta') {
    // OpenRouter ruft die Seite auf seinen Servern ab, beschränkt auf die geteilte Domain
    const host = new URL(input.fetchUrl || input.url).hostname.replace(/^www\./, '');
    const domains = input.kind === 'insta' ? ['instagram.com', 'www.instagram.com'] : /nyti\.ms|nytimes\.com/.test(host) ? ['nytimes.com', 'cooking.nytimes.com', 'nyti.ms'] : [host];
    body.tools = [{ type: 'openrouter:web_fetch', parameters: { engine: 'firecrawl', max_uses: 3, max_content_tokens: 40000, allowed_domains: domains } }];
    delete body.response_format; // JSON-Modus und Werkzeuge vertragen sich bei Gemini nicht
  }
  return body;
}

/* Gleiche Logik wie im Service Worker, für den Fall, dass er nicht verfügbar ist.
   Ergebnis: { status: 'done', content, finish, cost, broken } oder { status: 'error', code, text } */
async function fetchJob(body, onProgress = () => {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 600000);
  const send = () => fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', signal: ctrl.signal,
    headers: { Authorization: `Bearer ${state.settings.apiKey.trim()}`, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin, 'X-Title': 'ReciGrab' },
    body: JSON.stringify(body),
  });
  let content = '', finish = '', cost = null, broken = false;
  try {
    let res = await send();
    if (!res.ok && res.status === 400) {
      const t = await res.text();
      if (/response_format|json/i.test(t)) { delete body.response_format; res = await send(); }
      else if (/stream/i.test(t) && body.stream) { body.stream = false; res = await send(); }
      else return { status: 'error', code: 400, text: t };
    }
    if (!res.ok) return { status: 'error', code: res.status, text: await res.text() };
    if (!(res.headers.get('content-type') || '').includes('event-stream')) {
      const j = await res.json();
      if (j.error) return { status: 'error', code: j.error.code || 500, text: JSON.stringify(j) };
      let c = j.choices?.[0]?.message?.content;
      if (Array.isArray(c)) c = c.map((x) => x.text || '').join('');
      return { status: 'done', content: c || '', finish: j.choices?.[0]?.finish_reason || '', cost: j.usage?.cost ?? null, broken: false };
    }
    onProgress('read', 0);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          let j; try { j = JSON.parse(payload); } catch (_) { continue; }
          if (j.error) return { status: 'error', code: j.error.code || 500, text: JSON.stringify(j) };
          const ch = j.choices?.[0], piece = ch?.delta?.content;
          if (piece) { content += Array.isArray(piece) ? piece.map((c) => c.text || '').join('') : piece; onProgress('write', (content.match(/"title"\s*:/g) || []).length); }
          if (ch?.finish_reason) finish = ch.finish_reason;
          if (j.usage?.cost !== undefined) cost = j.usage.cost;
        }
      }
    } catch (e) { if (e.name === 'AbortError') throw e; broken = true; }
  } catch (e) {
    if (e.name === 'AbortError') return { status: 'error', code: 'timeout', text: '' };
    broken = true;
  } finally { clearTimeout(timer); }
  return { status: 'done', content, finish, cost, broken };
}

function parseJson(txt) {
  let s = String(txt).trim().replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = s.indexOf('{');
  if (a < 0) return null;
  s = s.slice(a);
  const b = s.lastIndexOf('}');
  try { return { data: JSON.parse(s.slice(0, b + 1)), salvaged: false }; } catch (_) {}
  // Abgeschnittene Antwort: alle vollständig gelieferten Rezepte retten
  const k = s.search(/"recipes"\s*:\s*\[/);
  if (k < 0) return null;
  const start = s.indexOf('[', k);
  let depth = 0, inStr = false, escNext = false, lastEnd = -1;
  for (let i = start; i < s.length; i++) {
    const c = s[i];
    if (inStr) { if (escNext) escNext = false; else if (c === '\\') escNext = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') { depth--; if (depth === 1 && c === '}') lastEnd = i; if (depth === 0) break; }
  }
  if (lastEnd < 0) return null;
  try { return { data: JSON.parse(s.slice(0, lastEnd + 1) + ']}'), salvaged: true }; } catch (_) { return null; }
}

function matchTag(cat, v) {
  if (!v) return null;
  const n = (s) => String(s).toLowerCase().replace(/[^a-zäöüß]/g, '');

}
function computeTags(r, x, kind) {
  const t = new Set();
  if (kind === 'youtube') t.add('Youtube');
  else if (kind === 'insta') t.add('Instagram');
  else { const q = matchTag('Quelle', x.quelle); if (q && q !== 'Youtube') t.add(q); }
  const tt = timeTag(r.totalTime); if (tt) t.add(tt);
  for (const [cat, key] of [['Gang', 'gang'], ['Hauptzutat', 'hauptzutat'], ['Aufwand', 'aufwand']]) { const m = matchTag(cat, x[key]); if (m) t.add(m); }
  if (x.vegetarisch === true) t.add('vegetarisch');
  return ALL_TAGS.filter((k) => t.has(k));
}

function normalizeOne(data, meta, source, kind) {
  const ings = (Array.isArray(data.ingredients) ? data.ingredients : []).map((i, k) => ({

async function normalizeAll(data, meta, input) {
  if (data.is_recipe === false) {
    if (input.kind === 'insta') throw new Error(`In der Beschreibung steht kein vollständiges Rezept${data.error ? ` (${String(data.error).slice(0, 160)})` : ''}. Lade das Reel in Instagram herunter (Teilen > Herunterladen) und teile das Video an ReciGrab.`);
    if (input.kind === 'web') throw new Error(`Die Seite ließ sich nicht lesen${data.error ? ` (${String(data.error).slice(0, 160)})` : ''}. Teile stattdessen Screenshots des Rezepts.`);
    throw new Error(input.kind === 'youtube' ? 'In diesem Video wurde kein Rezept gefunden.' : 'Darin wurde kein Rezept gefunden.');
  }
  const list = Array.isArray(data.recipes) ? data.recipes : (data.ingredients ? [data] : []);
  const source = input.kind === 'youtube' ? (meta?.author_name || data.channel || '') : input.kind === 'clip' ? (data.channel ? String(data.channel) : '') : (data.source_name ? String(data.source_name) : '');
  const out = list.map((x) => normalizeOne(x, meta, source, input.kind)).filter(Boolean);
  if (!out.length) throw new Error('Das Modell hat kein verwertbares Rezept geliefert.');
  if (input.kind === 'youtube' && out.length > 1) {
    // Jedem Rezept ein eigenes Standbild aus seinem Videoteil, möglichst verschieden
    const dur = num(data.video_duration_s);
    const used = new Set();
    for (const r of out) {
      const t = r.hero ?? r.partStart;
      let n = pickFrame(t, dur);
      if (n && used.has(n) && dur && t !== null) {
        const free = [1, 2, 3].filter((k) => !used.has(k));
        if (free.length) n = free.sort((a, b) => Math.abs(a / 4 * dur - t) - Math.abs(b / 4 * dur - t))[0];
      }
      r.thumb = n; if (n) used.add(n);
    }
  }
  if (input.kind === 'clip') {
    // Für jedes Rezept ein Standbild aus dem Video, an der Stelle mit dem fertigen Gericht
    for (const r of out) {
      try {
        const frame = await grabFrame(input.video, r.hero ?? (r.partStart !== null ? r.partStart + 5 : null));
        if (frame) {
          r.pages = [frame]; r.pageJoin = [0];
          const g = (await pageGroups(r.pages, r.pageJoin))[0];
          r.cropSel = { g: 0, cx: 0.5, cy: g.H / 2 / g.W, s: Math.min(1, g.H / g.W) };
          Object.assign(r, bakeSel(g, r.cropSel));
        }
      } catch (_) {}
    }
  }
  let groups = null;
  for (const r of out) {
    if (input.kind === 'photo' && r.dishPhoto && input.pages[r.dishPhoto.image]) {
      try {
        groups = groups || await pageGroups(input.pages, input.joins);
        const gi = groups.findIndex((g) => g.slices.some((sl) => sl.i === r.dishPhoto.image));
        const g = groups[gi], sl = g.slices.find((x) => x.i === r.dishPhoto.image);
        const [y0, x0, y1, x1] = r.dishPhoto.box.map((v) => clamp(Number(v) || 0, 0, 1000) / 1000);
        const bx = x0 * sl.w, by = sl.off + y0 * sl.h, bw = (x1 - x0) * sl.w, bh = (y1 - y0) * sl.h;
        if (bw >= 120 && bh >= 80) {
          r.cropSel = { g: gi, cx: (bx + bw / 2) / g.W, cy: (by + bh / 2) / g.W, s: Math.min(bw, bh) / g.W };
          Object.assign(r, bakeSel(g, r.cropSel, [bx, by, bw, bh]));
        }
      } catch (_) {}
    }
    delete r.dishPhoto;
  }
  return out;
}

function resolveThumb(r) {

  return chain.reduce((prev, u) => prev.then((hit) => hit || new Promise((res) => {
    const i = new Image(); i.onload = () => res(i.naturalWidth > 120 ? u : null); i.onerror = () => res(null); i.src = u;
  })), Promise.resolve(null));
}
async function askFocus(urls) {
  const prompt = `Du bekommst ${urls.length} Vorschaubild(er) von Kochvideos. Bestimme für jedes Bild, wo horizontal die Mitte des Essens liegt (fertiges Gericht oder wichtigste Speise). Ignoriere Personen und eingeblendete Schrift. x = 0 ist der linke Rand, x = 100 der rechte Rand. Ist kein Essen zu sehen, setze null. Antworte nur mit JSON: {"x": [Zahl oder null für jedes Bild, in der Reihenfolge der Bilder]}`;
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { Authorization: `Bearer ${state.settings.apiKey.trim()}`, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin, 'X-Title': 'ReciGrab' },
    body: JSON.stringify({
      model: state.settings.model || DEFAULT_MODEL,
      messages: [{ role: 'user', content: [{ type: 'text', text: prompt }, ...urls.map((u) => ({ type: 'image_url', image_url: { url: u } }))] }],
      provider: { only: ['google-ai-studio'], allow_fallbacks: false },
      response_format: { type: 'json_object' }, temperature: 0, max_tokens: 2000, reasoning: { effort: 'low' },
    }),
  });
  if (!res.ok) throw new Error(apiError(res.status, await res.text()));
  const j = await res.json();

  if (Array.isArray(c)) c = c.map((x) => x.text || '').join('');

let focusBusy = false;
async function autoFocus(list) {
  if (focusBusy || !state.settings.apiKey || !navigator.onLine) return;
  const todo = list.filter((r) => r.status === 'ok' && r.videoId && !r.focusManual && r.focus === undefined && !r.focusTried);
  if (!todo.length) return;
  focusBusy = true;
  try {
    const items = [];
    for (const r of todo) {
      const u = await resolveThumb(r);
      if (u) items.push({ id: r.id, u });
      else { const fresh = await db.one(r.id); if (fresh) { fresh.focusTried = true; await db.put(fresh); } }
    }
    for (let k = 0; k < items.length; k += 8) {
      const batch = items.slice(k, k + 8);
      let xs = null, giveUp = false;
      try { xs = await askFocus(batch.map((b) => b.u)); } catch (e) { giveUp = !(e instanceof TypeError); }
      if (!xs && !giveUp) continue; // offline: beim nächsten Start noch einmal
      for (let n = 0; n < batch.length; n++) {
        const fresh = await db.one(batch[n].id);
        if (!fresh || fresh.focusManual) continue;
        fresh.focusTried = true;
        const x = xs ? num(xs[n]) : null;
        if (x !== null) fresh.focus = focusFromCenter(Math.max(0, Math.min(100, x)) / 100);
        await db.put(fresh);
      }
    }
    state.recipes = await db.all();
    if ((location.hash || '#/') === '#/') renderFeed();
  } finally { focusBusy = false; }
}

let pendingInput = null;

async function startImport(raw) {
  const vid = ytId(raw);
  if (!vid) {
    const s = String(raw || '').trim();
    const link = s.match(/https?:\/\/[^\s<>"']+/i)?.[0]?.replace(/[).,;!?]+$/, '');
    if (link && s.length < 600) return startWebImport(link);
    if (s.length >= 120) return startTextImport(s);
    toast('Darin steckt kein Link und kein Rezepttext.'); return;
  }
  const siblings = state.recipes.filter((r) => r.videoId === vid);
  const done = siblings.filter((r) => r.status === 'ok');
  if (siblings.some((r) => r.status === 'importing')) { toast('Läuft schon.'); return; }
  if (done.length) { toast(done.length > 1 ? `Die ${done.length} Rezepte aus diesem Video hast du schon.` : 'Dieses Rezept hast du schon.'); go(done.length > 1 ? '#/' : `#/r/${done[0].id}`); return; }

}
async function startPhotoImport(blobs) {

  if (!blobs.length) return;
  if (blobs.length > 6) toast('Es werden die ersten 6 Bilder verwendet.');
  const pages = [], joins = [];
  for (const b of blobs.slice(0, 6)) {
    try { for (const part of await prepImageParts(b)) { pages.push(part.url); joins.push(part.join); } } catch (_) {}
  }
  if (!pages.length) { toast('Die Bilder konnten nicht gelesen werden.'); return; }
  if (pages.length > 16) { pages.length = 16; joins.length = 16; toast('Sehr lang: Es wird nur der obere Teil verwendet.'); }
  const input = { kind: 'photo', pages, joins };
  if (needKey(input)) return;
  await runImport(input, []);
}
async function startWebImport(url) {
  let u;
  try { u = new URL(url); } catch (_) { toast('Diesen Link kann ReciGrab nicht lesen.'); return; }
  // Instagram: die Einbett-Ansicht mit Beschreibung ist ohne Login lesbar
  const ig = /(^|\.)instagram\.com$/i.test(u.hostname) && u.pathname.match(/^\/(?:[^/]+\/)?(p|reel|reels|tv)\/([\w-]+)/i);
  const input = ig ? { kind: 'insta', url: `https://www.instagram.com/${ig[1] === 'p' ? 'p' : 'reel'}/${ig[2]}/`, fetchUrl: `https://www.instagram.com/p/${ig[2]}/embed/captioned/` } : { kind: 'web', url: u.href };
  // Instagram-Beiträge über ihre Kennung vergleichen, andere Links über Adresse ohne Parameter
  const key = (x) => { try { const v = new URL(x); const m = v.pathname.match(/\/(?:p|reels?|tv)\/([\w-]+)/); return /instagram\.com$/.test(v.hostname) && m ? `ig:${m[1]}` : v.hostname.replace(/^www\./, '') + v.pathname.replace(/\/$/, ''); } catch (_) { return x; } };
  const done = state.recipes.filter((r) => r.status === 'ok' && r.sourceUrl && key(r.sourceUrl) === key(input.url));
  if (done.length) { toast('Dieses Rezept hast du schon.'); go(`#/r/${done[0].id}`); return; }
  if (state.recipes.some((r) => r.status === 'importing' && r.input?.url && key(r.input.url) === key(input.url))) { toast('Läuft schon.'); return; }

}
async function startVideoImport(file) {
  const MAX = 15 * 1024 * 1024;
  if (file.size > MAX) { toast(`Das Video ist mit ${decimal(file.size / 1048576, 1)} MB zu groß, möglich sind 15 MB. Kürze es oder nimm eine Bildschirmaufnahme in geringerer Auflösung.`); return; }

async function startFilesImport(files) {
  files = [...files].filter((f) => f && f.size);

/* Ergebnis eines Auftrags auswerten und speichern (auch nach einem Neustart der App) */
const finalizing = new Set();
async function finalizeImport(id, job) {
  if (finalizing.has(id)) return;
  finalizing.add(id);
  try {
    const rec = await db.one(id);
    if (!rec || rec.status !== 'importing') return;
    const input = rec.input || { kind: 'youtube', videoId: rec.videoId };
    let list, truncated = false;
    try {
      if (job.status === 'error') throw new Error(apiError(job.code, job.text || ''));
      if (!job.content?.trim()) throw new Error(job.broken ? DROP_MSG : `Das Modell hat leer geantwortet${job.finish ? ` (${job.finish})` : ''}. Versuch es noch einmal.`);
      const parsed = parseJson(job.content);
      if (!parsed) throw new Error(job.broken ? DROP_MSG : `Die Antwort des Modells war kein gültiges Rezept-Format${/length|max/i.test(job.finish) ? ', sie wurde abgeschnitten' : ''}. Versuch es noch einmal.`);
      truncated = parsed.salvaged || job.broken;
      const meta = input.kind === 'youtube' ? await oembed(videoUrl(input.videoId)) : null;
      list = await normalizeAll(parsed.data, meta, input);
    } catch (e) {
      if (rec.backup?.length) { await db.del(rec.id); for (const b of rec.backup) await db.put(b); toast(e.message); }
      else { rec.status = 'error'; rec.error = e.message; await db.put(rec); }
      await softRefresh();
      return;
    }
    await db.del(rec.id);
    const cost = job.cost !== null && job.cost !== undefined ? job.cost / list.length : null;
    for (let k = 0; k < list.length; k++) {
      await db.put({
        ...list[k], id: k ? newId() : rec.id, batch: rec.id, kind: input.kind,
        videoId: input.videoId || null, pages: input.pages || list[k].pages || null, pageJoin: input.joins || list[k].pageJoin || null, sourceText: input.text || null, sourceUrl: input.url || null,
        createdAt: rec.createdAt - k, status: 'ok', importedAt: Date.now(), cost,
        part: list.length > 1 ? k + 1 : 0, partsTotal: list.length,
      });
    }
    await softRefresh();
    autoFocus(state.recipes.filter((x) => x.batch === rec.id));
    toast((list.length > 1 ? `${list.length} Rezepte gespeichert.` : `„${list[0].title}“ ist gespeichert.`) + (truncated ? ' Die Antwort war abgeschnitten, eventuell fehlen Rezepte. Tippe auf „Neu einlesen“.' : ''));
  } finally { finalizing.delete(id); }
}
/* Fertige Hintergrund-Aufträge abholen */
async function collectJobs() {
  let list = [];
  try { list = await jobs.all(); } catch (_) { return; }
  for (const job of list) {
    if (job.status === 'running') continue;
    await finalizeImport(job.id, job);
    await jobs.del(job.id).catch(() => {});
  }
}
/* Neu laden, ohne ein offenes Bearbeiten-Formular zu verwerfen */
async function softRefresh() {
  state.recipes = await db.all();
  if ($('#editform')) return;
  if ((location.hash || '#/') === '#/') { const y = scrollY; render(); scrollTo(0, y); } else render();
}

/* ---------- Skalierung ---------- */
function factorFor(r) {
  const v = state.servings[r.id];
  if (r.servings) return (v ?? r.servings) / r.servings;
  return v ?? 1;
}
const scale = (a, f) => (a === null || a === undefined ? null : a * f);

function useFor(r, use) {
  const ing = r.ingredients.find((i) => i.id === use.ref);
  if (!ing) return null;
  let amount = use.amount, unit = use.unit;
  if (amount === null) {
    const count = r.steps.filter((s) => s.uses.some((u) => u.ref === use.ref)).length;
    if (count === 1) { amount = ing.amount; unit = ing.unit; }
  }
  return { ing, amount, unit: unit || ing.unit, est: !!ing.est };
}

/* Vorschaubild aus Screenshot wählen: Bild unter dem Kachel-Quadrat verschieben und zoomen */
const cropState = { ptrs: new Map() };
async function openCropper(r) {
  if (!r.pages?.length) return;
  const groups = await pageGroups(r.pages, r.pageJoin);
  const sel = r.cropSel && groups[r.cropSel.g] ? r.cropSel : null;
  Object.assign(cropState, { r, groups, g: sel ? sel.g : 0, z: 1, tx: 0, ty: 0 });
  const d = $('#cropdlg');
  renderCropper();
  if (!d.open) d.showModal();
  requestAnimationFrame(() => initCropView(sel));
}
function renderCropper() {
  const { r, groups, g } = cropState;
  const gr = groups[g];
  $('#cropbody').innerHTML = `
    <h2>Vorschaubild wählen</h2>
    <p class="sub" style="margin:0">Mit einem Finger verschieben, mit zwei Fingern oder dem Regler zoomen.</p>
    <div class="tile cropvp" id="cropvp"><div class="cstage" id="cstage" style="width:${gr.W}px;height:${gr.H}px">${gr.slices.map((sl) => `<img src="${r.pages[sl.i]}" style="top:${sl.off}px;width:${sl.w}px;height:${sl.h}px" alt="">`).join('')}</div>${tileChrome(r)}</div>
    <label class="flabel" for="czoom">Zoom</label>
    <input class="cropzoom" id="czoom" type="range" min="1" max="4" step="0.01" value="1">
    ${groups.length > 1 ? `<span class="flabel">Bild</span><div class="csrc">${groups.map((x, k) => `<button type="button" data-act="cgroup" data-k="${k}" aria-pressed="${k === g}" aria-label="Bild ${k + 1}"><img src="${r.pages[x.slices[0].i]}" alt=""></button>`).join('')}</div>` : ''}
    <div class="rowbtns"><button class="btn primary" type="button" data-act="csave">Übernehmen</button><button class="btn ghost" type="button" data-act="cclose">Abbrechen</button></div>`;
  bindCropPointers();
}
function initCropView(sel) {
  const vp = $('#cropvp'); if (!vp) return;
  const gr = cropState.groups[cropState.g];
  const V = vp.getBoundingClientRect().width;
  const short = Math.min(gr.W, gr.H);
  Object.assign(cropState, { V, base: V / short, zmax: Math.max(1, short / 240) });
  $('#czoom').max = cropState.zmax;
  if (sel && sel.g === cropState.g) {
    cropState.z = clamp(short / clamp(sel.s * gr.W, 1, short), 1, cropState.zmax);
    const k = cropState.base * cropState.z;
    cropState.tx = V / 2 - sel.cx * gr.W * k; cropState.ty = V / 2 - sel.cy * gr.W * k;
  } else { cropState.z = 1; cropState.tx = 0; cropState.ty = 0; }
  $('#czoom').value = cropState.z;
  layoutCrop();
}
function layoutCrop() {
  const { V, base, z } = cropState;
  const gr = cropState.groups[cropState.g];
  const k = base * z;
  cropState.tx = clamp(cropState.tx, V - gr.W * k, 0);
  cropState.ty = clamp(cropState.ty, V - gr.H * k, 0);
  $('#cstage').style.transform = `translate(${cropState.tx}px, ${cropState.ty}px) scale(${k})`;
}
function zoomCrop(z, ax, ay) {
  const { V } = cropState;
  ax = ax ?? V / 2; ay = ay ?? V / 2;
  const k0 = cropState.base * cropState.z;
  const z1 = clamp(z, 1, cropState.zmax), k1 = cropState.base * z1;
  const px = (ax - cropState.tx) / k0, py = (ay - cropState.ty) / k0;
  Object.assign(cropState, { z: z1, tx: ax - px * k1, ty: ay - py * k1 });
  layoutCrop();
  const zs = $('#czoom'); if (zs && document.activeElement !== zs) zs.value = z1;
}
function bindCropPointers() {
  const vp = $('#cropvp'), ps = cropState.ptrs;
  ps.clear();
  let last = null;
  const mid = () => {
    const a = [...ps.values()];
    return a.length >= 2 ? { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) } : { x: a[0].x, y: a[0].y, d: 0 };
  };
  vp.addEventListener('pointerdown', (e) => { vp.setPointerCapture(e.pointerId); ps.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = mid(); });
  vp.addEventListener('pointermove', (e) => {
    if (!ps.has(e.pointerId)) return;
    ps.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const m = mid(), rect = vp.getBoundingClientRect();
    if (last) {
      if (ps.size >= 2 && last.d && m.d) zoomCrop(cropState.z * m.d / last.d, m.x - rect.left, m.y - rect.top);
      cropState.tx += m.x - last.x; cropState.ty += m.y - last.y;
      layoutCrop();
    }
    last = m;
  });
  const up = (e) => { ps.delete(e.pointerId); last = ps.size ? mid() : null; };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = vp.getBoundingClientRect();
    zoomCrop(cropState.z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });
}
async function saveCrop() {
  const { r, groups, g, V, base, z, tx, ty } = cropState;
  const gr = groups[g], k = base * z;
  const sel = { g, cx: (V / 2 - tx) / k / gr.W, cy: (V / 2 - ty) / k / gr.W, s: V / k / gr.W };
  Object.assign(r, bakeSel(gr, sel), { cropSel: sel, tileMode: 'image', focus: 50, focusManual: true });
  delete r.coverPage;
  await db.put(r);
  $('#cropdlg').close();
  const f = $('#editform');
  if (f) {
    f.querySelectorAll('[data-act="kmode"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === 'image')));
    updatePreview();
  } else if ((location.hash || '#/') === '#/') renderFeed();
  else rerenderKeepScroll();
  toast('Vorschaubild gespeichert.');
}

function stepHtml(r, s, f) {
  const uses = s.uses.map((u) => useFor(r, u)).filter(Boolean);
  const label = (x) => {
    const a = fmtAmount(scale(x.amount, f), x.unit);
    return `<span class="ing${x.est ? ' est' : ''}">${esc(a ? `${x.est ? '≈ ' : ''}${a} ${x.ing.name}` : x.ing.name)}</span>`;
  };
  const used = new Set();
  let text = esc(s.text).replace(/\{(\d+)\}/g, (m, k) => { const x = uses[+k]; if (!x) return ''; used.add(+k); return label(x); });
  const rest = uses.filter((_, k) => !used.has(k));
  if (rest.length) text += ` <span style="white-space:normal">${rest.map(label).join(' ')}</span>`;
  return text;
}

      <div class="thumbpick">${thumbOpts.map((o) => `<button type="button" data-act="thumbpick" data-n="${o.key}" aria-pressed="${o.on}">${o.html}</button>`).join('')}</div>` : ''}

function editDraft(f) {

}
