async function addToShop(r) {
  const f = factorFor(r);
  for (const i of r.ingredients) {
    const [amount, unit] = i.amount === null ? [null, i.unit] : toBase(i.amount * f, i.unit);
    const key = `${i.name.toLowerCase().trim()}|${unit}`;
    const hit = state.shopping.find((s) => !s.checked && s.key === key);
    if (hit) {
      hit.amount = hit.amount === null || amount === null ? (hit.amount ?? amount) : hit.amount + amount;
      hit.est = hit.est || i.est;
      if (!hit.from.includes(r.title)) hit.from.push(r.title);
    } else state.shopping.push({ id: uid(), key, name: i.name, amount, unit, est: i.est, pantry: i.pantry, checked: false, from: [r.title] });
  }
  await db.set('shopping', state.shopping); updateShopCount();
  toast('Zutaten sind auf der Einkaufsliste.');
}

/* ---------- Ereignisse ---------- */
function rerenderKeepScroll() { const y = scrollY; render(); scrollTo(0, y); }

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const r = id ? state.recipes.find((x) => x.id === id) : null;
  switch (act) {
    case 'togglefilter': state.showFilter = !state.showFilter; rerenderKeepScroll(); break;
    case 'filter': {
      const c = el.dataset.cat, t = el.dataset.tag;
      const arr = state.filter[c] || (state.filter[c] = []);
      const i = arr.indexOf(t);
      if (i >= 0) arr.splice(i, 1); else arr.push(t);
      if (!arr.length) delete state.filter[c];
      rerenderKeepScroll(); break;
    }
    case 'clearfilter': state.filter = {}; rerenderKeepScroll(); break;
    case 'tm': case 'tf': {
      if (!r) break;
      if (act === 'tm') r.tileMode = el.dataset.v; else { r.focus = +el.dataset.v; r.focusManual = true; }
      await db.put(r); openTileMenu(r); renderFeed(); break;
    }
    case 'tdclose': $('#tiledlg').close(); break;
    case 'crop': if (r) { if ($('#tiledlg').open) $('#tiledlg').close(); openCropper(r); } break;
    case 'cgroup': cropState.g = +el.dataset.k; renderCropper(); requestAnimationFrame(() => initCropView(cropState.r.cropSel)); break;
    case 'csave': saveCrop(); break;
    case 'cclose': $('#cropdlg').close(); break;
    case 'kmode': el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); updatePreview(); break;
    case 'retry': {
      if (!r) break;
      if (r.kind === 'youtube' && r.videoId) { await db.del(r.id); state.recipes = state.recipes.filter((x) => x.id !== r.id); startImport(videoUrl(r.videoId)); }
      else if (r.input) { if (!needKey(r.input)) runImport(r.input, [r]); }
      break;
    }
    case 'remove': if (r) { await db.del(r.id); refresh(); } break;
    case 'less': case 'more': {
      const stepSize = r.servings ? (r.servings >= 2 ? 1 : 0.5) : 0.5;
      const curVal = r.servings ? (state.servings[r.id] ?? r.servings) : (state.servings[r.id] ?? 1);
      state.servings[r.id] = Math.max(stepSize, curVal + (act === 'more' ? stepSize : -stepSize));
      rerenderKeepScroll(); break;
    }
    case 'toshop': if (r) addToShop(r); break;
    case 'wake': await toggleWake(); rerenderKeepScroll(); break;
    case 'step': {
      if (e.target.closest('a')) return;
      const set = state.done[id] || (state.done[id] = new Set()); const k = +el.dataset.k;
      set.has(k) ? set.delete(k) : set.add(k); el.classList.toggle('done'); break;
    }
    case 'reimport': {
      const input = r && inputOf(r);
      if (!input) break;
      const sib = siblingsOf(r).filter((x) => x.status === 'ok');
      const msg = sib.length > 1 ? `Alle ${sib.length} Rezepte aus dieser Quelle neu einlesen? Deine Änderungen gehen dabei verloren.` : 'Rezept neu einlesen? Deine Änderungen gehen dabei verloren.';
      if (confirm(msg) && !needKey(input)) runImport(input, siblingsOf(r));
      break;
    }
    case 'delete': if (r && confirm(`„${r.title}“ löschen?`)) { await db.del(r.id); await refresh(); go('#/'); toast('Gelöscht.'); } break;
    case 'tagtoggle': {
      const t = el.dataset.tag, on = el.getAttribute('aria-pressed') !== 'true';
      if (on && catOf(t) !== 'Ernährung') el.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
      el.setAttribute('aria-pressed', String(on)); break;
    }
    case 'thumbpick': el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); updatePreview(); break;
    case 'adding': $('#eding').insertAdjacentHTML('beforeend', ingRow({ id: 'n' + uid(), amount: null, unit: '', name: '' })); break;
    case 'deling': el.closest('.ed-ing').remove(); break;
    case 'check': {
      const it = state.shopping.find((i) => i.id === id); if (!it) break;
      it.checked = el.checked; await db.set('shopping', state.shopping); updateShopCount(); render(); break;
    }
    case 'clearchecked': state.shopping = state.shopping.filter((i) => !i.checked); await db.set('shopping', state.shopping); updateShopCount(); render(); break;
    case 'clearall': if (confirm('Ganze Einkaufsliste leeren?')) { state.shopping = []; await db.set('shopping', []); updateShopCount(); render(); } break;
    case 'testkey': testKey(); break;
    case 'design': setDesign(el.dataset.v); render(); toast(el.dataset.v === 'kartei' ? 'Aussehen: Karteikasten.' : 'Aussehen: Klassisch.'); break;
    case 'notify':
      if (Notification.permission === 'denied') toast('Benachrichtigungen sind für ReciGrab blockiert. Erlauben kannst du sie in den Android-Einstellungen der App.');
      else { await Notification.requestPermission(); render(); }
      break;
    case 'export': exportBackup(); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { state.q = e.target.value; renderFeed(); }
  if (e.target.id === 'kfocus') { e.target.dataset.touched = 1; updatePreview(); }
  if (e.target.id === 'czoom') zoomCrop(+e.target.value);
  if (e.target.form?.id === 'editform' && (e.target.name === 'title' || e.target.name === 'channel')) updatePreview();
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'importfile' && e.target.files[0]) importBackup(e.target.files[0]);
  if (e.target.id === 'videoin' && e.target.files.length) {
    const file = e.target.files[0]; e.target.value = '';
    $('#adddlg').close(); startVideoImport(file);
  }
  if (e.target.id === 'photoin' && e.target.files.length) {
    const files = [...e.target.files]; e.target.value = '';
    $('#adddlg').close(); startPhotoImport(files);
  }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.id === 'setform') {
    e.preventDefault();
    state.settings.apiKey = f.apiKey.value.trim();
    state.settings.model = f.model.value.trim() || DEFAULT_MODEL;
    await db.set('settings', state.settings);
    $('#keystatus').innerHTML = '<span class="ok">Gespeichert.</span>';
    if (pendingInput && state.settings.apiKey) {
      const input = pendingInput; pendingInput = null;
      if (input.kind === 'youtube') startImport(videoUrl(input.videoId)); else runImport(input, []);
    }
  }
  if (f.id === 'editform') {
    e.preventDefault();
    const r = state.recipes.find((x) => x.id === f.dataset.id); if (!r) return;
    const el = f.elements;
    r.title = el.title.value.trim() || r.title;
    r.channel = el.channel.value.trim();
    const sv = num(el.servings.value.replace(',', '.'));
    if (sv !== r.servings) r.servingsEst = false;
    r.servings = sv && sv > 0 ? sv : null;
    const tt = num(el.totalTime.value);
    if (tt !== r.totalTime) r.totalTimeEst = false;
    r.totalTime = tt && tt > 0 ? tt : null;
    const imgKey = () => `${r.thumb || 0}|${r.image ? 'i' : ''}|${r.coverPage || 0}`;
    const before = imgKey();
    const tp = f.querySelector('.thumbpick [aria-pressed="true"]');
    if (tp) {
      const k = tp.dataset.n;
      if (k[0] === 'v') { r.thumb = +k.slice(1); r.image = null; }
      else if (k[0] === 'p') { r.image = null; r.coverPage = +k.slice(1); }
    }
    const km = f.querySelector('[data-act="kmode"][aria-pressed="true"]');
    if (km) r.tileMode = km.dataset.v;
    const kf = f.querySelector('#kfocus');
    let refocus = false;
    if (kf && kf.dataset.touched) { r.focus = +kf.value; r.focusManual = true; }
    else if (before !== imgKey()) { delete r.focus; r.focusTried = false; r.focusManual = false; refocus = !!r.videoId; }
    const picked = [...f.querySelectorAll('.tagpick .chip[aria-pressed="true"]')].map((c) => c.dataset.tag);
    const tTag = timeTag(r.totalTime);
    r.tags = ALL_TAGS.filter((t) => picked.includes(t) || t === tTag);
    const old = new Map(r.ingredients.map((i) => [i.id, i]));
    r.ingredients = [...f.querySelectorAll('.ed-ing')].map((row) => {
      const g = (k) => row.querySelector(`[data-f="${k}"]`).value.trim();
      const prev = old.get(row.dataset.iid) || {};
      const amount = num(g('amount').replace(',', '.'));
      const est = !!row.dataset.est && amount !== null && String(amount) === row.dataset.orig;
      return { id: row.dataset.iid, group: prev.group || null, name: g('name'), amount, est, unit: g('unit'), note: prev.note || '', pantry: !!prev.pantry };
    }).filter((i) => i.name);
    const ids = new Set(r.ingredients.map((i) => i.id));
    r.steps = r.steps.map((s, k) => ({ ...s, text: (el[`step${k}`]?.value ?? s.text).trim(), uses: s.uses.filter((u) => ids.has(u.ref)) })).filter((s) => s.text);
    r.tips = el.tips.value.trim();
    delete state.servings[r.id];
    await db.put(r); await refresh(); go(`#/r/${r.id}`); toast('Gespeichert.');
    if (refocus) autoFocus([r]);
  }
  if (f.id === 'shopadd') {
    e.preventDefault();
    const v = $('#shopnew').value.trim(); if (!v) return;
    const m = v.match(/^(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|EL|TL|Stk|Prise|Bund|Dose)?\s+(.+)$/i);
    const item = m ? { amount: Number(m[1].replace(',', '.')), unit: m[2] || '', name: m[3] } : { amount: null, unit: '', name: v };
    state.shopping.push({ id: uid(), key: `${item.name.toLowerCase()}|${item.unit}`, ...item, pantry: false, checked: false, from: [] });
    await db.set('shopping', state.shopping); updateShopCount(); render(); $('#shopnew').focus();
  }
});

/* Vorschaubilder: fehlende Auflösungen liefert YouTube als 120px-Platzhalter, dann nächste Quelle probieren */
function nextThumb(img) {
  const rest = (img.dataset.chain || '').split('|').filter(Boolean);
  if (!rest.length) return;
  img.src = rest.shift(); img.dataset.chain = rest.join('|');
}
document.addEventListener('load', (e) => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.classList.contains('yt')) return;
  if (img.naturalWidth <= 120) { nextThumb(img); return; }
  // sd- und hq-Bilder sind 4:3 mit schwarzen Balken oben und unten, in den Kacheln werden diese weggeschnitten
  img.classList.toggle('lb', img.naturalWidth / img.naturalHeight < 1.5);
}, true);

/* Langes Drücken auf eine Kachel öffnet das Kachel-Menü */
let lp = null, suppressClick = false;
function openTileMenuById(id) {
  if ($('#tiledlg').open) return;
  const r = state.recipes.find((x) => x.id === id);
  if (!r) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 900);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
  openTileMenu(r);
}
document.addEventListener('contextmenu', (e) => {
  const t = e.target.closest('a.tile[data-id]');
  if (!t) return;
  e.preventDefault();
  if (lp) { clearTimeout(lp.timer); lp = null; }
  openTileMenuById(t.dataset.id);
});
document.addEventListener('pointerdown', (e) => {
  const t = e.target.closest('a.tile[data-id]');
  if (!t || e.button > 0) return;
  if (lp) clearTimeout(lp.timer);
  lp = { x: e.clientX, y: e.clientY, timer: setTimeout(() => { lp = null; openTileMenuById(t.dataset.id); }, 550) };
}, { passive: true });
document.addEventListener('pointermove', (e) => {
  if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.timer); lp = null; }
}, { passive: true });
for (const ev of ['pointerup', 'pointercancel', 'scroll']) document.addEventListener(ev, () => { if (lp) { clearTimeout(lp.timer); lp = null; } }, { passive: true });
document.addEventListener('click', (e) => {
  if (suppressClick && e.target.closest('a.tile')) { e.preventDefault(); e.stopPropagation(); suppressClick = false; }
}, true);
/* Dialoge schließen bei Tipp neben den Dialog */
for (const d of [$('#tiledlg'), $('#adddlg')]) {
  d.addEventListener('click', (e) => {
    if (e.target !== d || Date.now() - (+d.dataset.openedAt || 0) < 700) return;
    const b = d.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) d.close();
  });
}
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.classList.contains('yt')) nextThumb(img);
}, true);

/* Hinzufügen-Dialog */
$('#fab').addEventListener('click', () => { $('#addurl').value = ''; $('#addtext').value = ''; $('#textbox').hidden = true; $('#adddlg').showModal(); });
$('#dlgclose').addEventListener('click', () => $('#adddlg').close());
$('#pastebtn').addEventListener('click', async () => {
  try { $('#addurl').value = await navigator.clipboard.readText(); } catch (_) { toast('Kein Zugriff auf die Zwischenablage. Füge den Link per Gedrückthalten ein.'); }
});
$('#urlgo').addEventListener('click', () => { const v = $('#addurl').value; $('#adddlg').close(); startImport(v); });
$('#texttoggle').addEventListener('click', () => { $('#textbox').hidden = !$('#textbox').hidden; if (!$('#textbox').hidden) $('#addtext').focus(); });
$('#textgo').addEventListener('click', () => { const v = $('#addtext').value; $('#adddlg').close(); startTextImport(v); });

/* Bildschirm anlassen beim Kochen */
async function toggleWake() {
  try {
    if (state.wake) { await state.wake.release(); state.wake = null; return; }
    state.wake = await navigator.wakeLock.request('screen');
    state.wake.addEventListener('release', () => { if (!document.hidden) state.wake = null; });
  } catch (_) { toast('Dein Browser kann den Bildschirm nicht anlassen.'); state.wake = null; }
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && state.wake) { try { state.wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
});

/* Aussehen */
const designOf = () => document.documentElement.dataset.design || 'kartei';
function setDesign(v) {
  document.documentElement.dataset.design = v;
  try { localStorage.setItem('rg-design', v); } catch (_) {}
  applyDesignTexts();
}
function applyDesignTexts() { $('#fab').textContent = designOf() === 'kartei' ? '+ GRAB' : '+ Rezept holen'; }
applyDesignTexts();

/* Schlüssel prüfen */
async function testKey() {
  const st = $('#keystatus');
  const key = $('#setform').apiKey.value.trim();
  if (!key) { st.innerHTML = '<span class="err">Bitte zuerst einen Schlüssel eintragen.</span>'; return; }
  st.textContent = 'Prüfe …';
  try {
    const r = await fetch('https://openrouter.ai/api/v1/key', { headers: { Authorization: `Bearer ${key}` } });
    if (!r.ok) { st.innerHTML = `<span class="err">${esc(apiError(r.status, await r.text()))}</span>`; return; }
    const d = (await r.json()).data || {};
    const used = d.usage != null ? `${decimal(d.usage, 2)} $ verbraucht` : '';
    const left = d.limit_remaining != null ? `, ${decimal(d.limit_remaining, 2)} $ Limit übrig` : '';
    st.innerHTML = `<span class="ok">Schlüssel funktioniert${used ? `: ${used}${left}` : ''}.</span>`;
  } catch (_) { st.innerHTML = '<span class="err">Keine Verbindung zu OpenRouter.</span>'; }
}

/* Sicherung */
function exportBackup() {
  const data = { app: 'rezeptfang', version: 2, exportedAt: new Date().toISOString(), recipes: state.recipes.filter((r) => r.status === 'ok'), shopping: state.shopping };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `recigrab-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importBackup(file) {
  const st = $('#backupstatus');
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'rezeptfang' || !Array.isArray(data.recipes)) throw new Error();
    for (const r of data.recipes) {
      if (!r || !r.id) continue;
      if (!r.kind) r.kind = r.videoId ? 'youtube' : 'text';
      if (!r.tagsV2) { r.tags = migrateTags(r); r.tagsV2 = true; }
      await db.put(r);
    }
    if (Array.isArray(data.shopping) && confirm('Auch die Einkaufsliste aus der Sicherung übernehmen?')) { state.shopping = data.shopping; await db.set('shopping', state.shopping); updateShopCount(); }
    state.recipes = await db.all();
    st.innerHTML = `<span class="ok">${data.recipes.length} Rezepte geladen.</span>`;
  } catch (_) { st.innerHTML = '<span class="err">Diese Datei ist keine ReciGrab-Sicherung.</span>'; }
}

/* ---------- Start ---------- */
window.addEventListener('hashchange', render);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', async (e) => {
    const m = e.data || {};
    if (m.type === 'progress') showProgress(m.id, m.phase, m.n);
    if (m.type === 'job') collectJobs();
  });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) collectJobs(); });
(async function init() {
  await load();
  const params = new URLSearchParams(location.search);
  const fromShare = params.has('share');
  const legacy = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ');
  if (location.search) history.replaceState(null, '', location.pathname + (location.hash || '#/'));
  render();
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // Beim ersten Start übernimmt der Service Worker erst nach kurzer Zeit die Kontrolle
    if (!navigator.serviceWorker.controller) await Promise.race([new Promise((res) => navigator.serviceWorker.addEventListener('controllerchange', res, { once: true })), new Promise((res) => setTimeout(res, 1500))]);
  }
  collectJobs();
  if (fromShare) {
    const items = await inboxTake();
    for (const it of items) {
      const files = (it.files || []).filter((x) => x && x.size);
      if (files.length) await startFilesImport(files);
      else if (it.text) await startImport(it.text);
    }
  } else if (legacy) startImport(legacy);
  // Bildausschnitt für bestehende Rezepte einmalig bestimmen
  setTimeout(() => autoFocus(state.recipes), 2500);
  if (state.recipes.some((r) => r.status === 'ok') && !(await db.get('hintTile'))) {
    await db.set('hintTile', 1);
    setTimeout(() => toast('Tipp: Lange auf eine Kachel drücken, um Bildausschnitt oder Titelkachel zu wählen.'), 1500);
  }
})();
</script>
</body>
</html>
