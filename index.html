<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezeptfang</title>
<meta name="theme-color" content="#24382C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --ink:#1C2620; --muted:#636D66; --line:#DBE0D8;
  --herb:#2E5A3F; --herb-ink:#FFFFFF; --herb-soft:#DCE8DF;
  --saffron:#D9961C; --saffron-soft:#FAE9C4; --saffron-ink:#5A3D05;
  --danger:#B0412D;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121815; --surface:#1B231E; --ink:#E8EDE7; --muted:#97A39A; --line:#2C3830;
    --herb:#8DC3A0; --herb-ink:#0F1A13; --herb-soft:#21342A;
    --saffron:#F0B84A; --saffron-soft:#3A2E14; --saffron-ink:#F7DFA8;
    --danger:#E5806A;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kopf der Liste */
.masthead{padding:28px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wordmark{margin:0;font-size:44px;line-height:.9;font-weight:800;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.wordmark span{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:8px}
.searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;font-size:16px}
.searchbox input:focus{border-color:var(--herb);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Feed */
.feed{display:grid;gap:26px;padding-top:6px}
.card{display:block;text-decoration:none;color:inherit}
.thumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;bottom:10px;background:rgba(15,20,17,.78);color:#fff;font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px}
.card h2{font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:12px 0 3px}
.card .meta{color:var(--muted);font-size:14px;margin:0}
.minitags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.minitag{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--herb-soft);color:var(--ink)}
.state{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  background:linear-gradient(to top,rgba(12,16,14,.86),rgba(12,16,14,.15));color:#fff}
.state strong{font-size:17px}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:40%;background:var(--saffron);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%;opacity:.6}}
.rowbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.empty{padding:40px 4px;text-align:left}
.empty h2{font-size:26px;line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.empty p{color:var(--muted);margin:0 0 8px;max-width:46ch}

/* Buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--herb-soft);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--herb);color:var(--herb-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);z-index:20;
  background:var(--saffron);color:#231803;border:0;border-radius:18px;padding:15px 20px;font-weight:700;font-size:16px;
  box-shadow:0 8px 24px rgba(60,40,0,.28);cursor:pointer}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;max-width:200px;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:13px;color:var(--muted);font-weight:600}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--herb)}
.tabs .count{background:var(--saffron);color:#231803;border-radius:999px;font-size:11px;padding:0 6px;margin-left:3px}

/* Detail */
.hero{position:relative;margin:0 -16px;aspect-ratio:16/9;background:var(--line);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;width:42px;height:42px;border-radius:50%;
  background:rgba(15,20,17,.7);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:24px}
.dtitle{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:18px 0 6px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:15px;align-items:center}
.dmeta a{color:var(--herb);font-weight:600;text-decoration:none}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.notice{background:var(--saffron-soft);color:var(--saffron-ink);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:16px 0 0}
.servings{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.servings button{width:48px;height:48px;border-radius:12px;border:0;background:var(--herb-soft);font-size:26px;font-weight:600;cursor:pointer}
.servings .val{text-align:center}
.servings .val strong{display:block;font-size:28px;line-height:1;font-weight:800}
.servings .val span{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.section-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:30px 0 10px}
.group-h{font-size:15px;font-weight:700;color:var(--muted);margin:16px 0 4px}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16.5px}
.ings .amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ings .note{color:var(--muted);font-size:14.5px}
.ings .amt.est{color:var(--muted)}
.ing.est{background:transparent;border:1.5px dashed var(--saffron)}
.thumbpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.thumbpick button{border:3px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:var(--line);aspect-ratio:16/9;cursor:pointer}
.thumbpick button[aria-pressed="true"]{border-color:var(--saffron)}
.thumbpick img{width:100%;height:100%;object-fit:cover;display:block}
.ings .missing{color:var(--saffron-ink);background:var(--saffron-soft);font-size:12.5px;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.steps{list-style:none;counter-reset:s;margin:0;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);font-weight:800;font-size:22px;color:var(--herb);line-height:1.2}
.steps p{margin:0;font-family:var(--read);font-size:18px;line-height:1.6}
.steps li.done p{opacity:.45}
.ing{background:var(--saffron-soft);color:var(--saffron-ink);border-radius:6px;padding:0 5px;font-family:var(--display);font-weight:650;font-size:16.5px;white-space:nowrap}
.ts{display:inline-block;margin-top:6px;font-size:13.5px;color:var(--herb);font-weight:600;text-decoration:none}
.tips{font-family:var(--read);font-size:17px;line-height:1.6;background:var(--surface);border-left:4px solid var(--saffron);border-radius:0 12px 12px 0;padding:12px 16px;margin:0}
.foot{margin:34px 0 10px;display:flex;gap:8px;flex-wrap:wrap}
.cost{color:var(--muted);font-size:13px;margin:8px 0 0}

/* Einkauf */
.pagetitle{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:28px 0 6px;line-height:1}
.sub{color:var(--muted);margin:0 0 14px}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.shop input[type=checkbox]{width:24px;height:24px;accent-color:var(--herb);flex:none}
.shop label{flex:1;display:flex;gap:10px;align-items:baseline;cursor:pointer}
.shop .amt{font-weight:700;min-width:70px;font-variant-numeric:tabular-nums}
.shop .from{display:block;font-size:12.5px;color:var(--muted)}
.shop li.checked label{opacity:.45;text-decoration:line-through}
.addrow{display:flex;gap:8px;margin:14px 0}
.addrow input{flex:1}

/* Formulare */
.field{display:block;margin:14px 0}
.field > span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.inp, .field input, .field textarea, .field select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px 16px;margin:16px 0}
.panel h3{font-size:18px;margin:14px 0 4px}
.ed-ing{display:grid;grid-template-columns:64px 64px 1fr 36px;gap:6px;margin:6px 0;align-items:center}
.ed-ing input{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:15px;width:100%;min-width:0}
.ed-ing .x{border:0;background:transparent;font-size:22px;color:var(--danger);cursor:pointer}
.ed-step{margin:10px 0}
.ed-step textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:15px;min-height:64px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.status{font-size:14px;margin-top:8px}
.ok{color:var(--herb)} .err{color:var(--danger)}

/* Dialog und Toast */
dialog{border:0;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,12,.55)}
dialog h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
dialog p{color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:50;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Filter */
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow input{flex:1;min-width:0}
.filterbtn{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;font-weight:600;cursor:pointer}
.filterbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filterbtn b{background:var(--saffron);color:#231803;border-radius:999px;padding:0 7px;font-size:13px;margin-left:2px}
.searchbox .chips{padding-top:10px;padding-bottom:4px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 14px;margin-top:10px}
.frow{padding:6px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:0}
.flabel{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.fpanel .chips{padding:2px 14px 4px;margin:0 -14px}
.fpanel .rowbtns{margin-top:10px}
/* Platzhalter ohne Bild */
.ph{width:100%;height:100%;display:flex;align-items:flex-end;padding:16px;background:var(--herb);color:var(--herb-ink)}
.ph span{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .ph span{font-size:34px}
/* Dialog */
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* Originalseiten */
.pages{margin:30px 0 0}
.pages summary{font-size:18px;font-weight:700;cursor:pointer;padding:6px 0}
.pages img{width:100%;border-radius:12px;margin-top:12px;display:block;border:1px solid var(--line)}
</style>
</head>
<body>
<main id="view" class="wrap" aria-live="polite"></main>

<button class="fab" id="fab" type="button">+ Rezept holen</button>

<nav class="tabs" aria-label="Hauptnavigation">
  <a href="#/" data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M10 8.2v3.6L13 10z" fill="currentColor"/><path d="M7 20h10"/></svg>
    Rezepte</a>
  <a href="#/einkauf" data-tab="shop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.3 11.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
    <span>Einkauf<span class="count" id="shopcount" hidden></span></span></a>
  <a href="#/einstellungen" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    Einstellungen</a>
</nav>

<dialog id="adddlg">
  <h2>Rezept hinzufügen</h2>
  <p>Am schnellsten über Teilen: Video aus der YouTube-App, Screenshots oder Fotos an Rezeptfang schicken.</p>
  <label class="field"><span>YouTube-Link</span><input id="addurl" type="url" inputmode="url" placeholder="https://youtu.be/..." autocomplete="off"></label>
  <div class="rowbtns">
    <button class="btn primary" type="button" id="urlgo">Rezept holen</button>
    <button class="btn ghost" type="button" id="pastebtn">Aus Zwischenablage</button>
  </div>
  <div class="or"><span>oder</span></div>
  <div class="rowbtns">
    <label class="btn" for="photoin">Fotos oder Screenshots</label>
    <input id="photoin" type="file" accept="image/*" multiple hidden>
    <button class="btn" type="button" id="texttoggle">Text einfügen</button>
  </div>
  <div id="textbox" hidden>
    <label class="field"><span>Rezepttext</span><textarea id="addtext" rows="7" placeholder="Zutaten und Zubereitung hier einfügen"></textarea></label>
    <button class="btn primary" type="button" id="textgo">Rezept erkennen</button>
  </div>
  <div class="rowbtns" style="margin-top:16px"><button class="btn ghost" type="button" id="dlgclose">Schließen</button></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ---------- Konstanten ---------- */
const APP_VERSION = '2.0 vom 22.10.2026';
const DEFAULT_MODEL = 'google/gemini-3.8-flash';
const TAXONOMY = {
  Quelle: ['Youtube', 'Buch', 'Zeitung', 'Blog'],
  Kochdauer: ['bis 30 Min', 'bis 60 Min', 'über 60 Min'],
  Gang: ['Vorspeise', 'Suppe', 'Salat', 'Hauptgericht', 'Beilage', 'Dessert'],
  Hauptzutat: ['Gemüse', 'Hülsenfrüchte', 'Pasta, Reis & Getreide', 'Ei & Käse', 'Fisch & Meeresfrüchte', 'Geflügel', 'Fleisch'],
  Aufwand: ['Alltag', 'Projekt'],
  'Ernährung': ['vegetarisch'],
};
const ALL_TAGS = Object.values(TAXONOMY).flat();
const catOf = (t) => Object.keys(TAXONOMY).find((c) => TAXONOMY[c].includes(t));
const OLD_TAGS = { main: 'Hauptgericht', salad: 'Salat', dessert: 'Dessert', side: 'Beilage', soup: 'Suppe', starter: 'Vorspeise' };
const timeTag = (t) => (t ? (t <= 30 ? 'bis 30 Min' : t <= 60 ? 'bis 60 Min' : 'über 60 Min') : null);

const SYSTEM_PROMPT = 'Du extrahierst Kochrezepte aus Videos, Bildern und Texten. Du antwortest ausschließlich mit einem einzigen JSON-Objekt nach dem vorgegebenen Schema, ohne Markdown und ohne Text davor oder danach.';

function buildPrompt(kind) {
  const video = kind === 'youtube', photo = kind === 'photo';
  const intro = {
    youtube: 'Schau dir das Video vollständig an (Bild, Ton, Einblendungen) und extrahiere die Rezepte.',
    photo: 'Die Bilder zeigen Rezepte: Fotos von Kochbuch- oder Zeitschriftenseiten oder Screenshots von Webseiten und Apps. Mehrere Bilder können zu einem Rezept gehören (z. B. Seite 1 und 2 oder ein langer Screenshot in mehreren Teilen). Lies alles vollständig und extrahiere die Rezepte.',
    text: 'Unten steht ein Rezepttext, etwa von einer Webseite kopiert. Extrahiere daraus die Rezepte.',
  }[kind];
  return `${intro}

Mehrere Rezepte:
- Enthält die Quelle mehrere eigenständige Gerichte, lege für jedes einen eigenen Eintrag in recipes an.
- Komponenten, die zu einem Gericht gehören (Sauce, Dressing, Topping, Teig), bleiben Teil dieses Rezepts und werden über group gekennzeichnet.
${video ? '- part_start_s: Sekunde, an der der Teil zu diesem Rezept beginnt. hero_s: Sekunde, an der das fertige Gericht am besten zu sehen ist. Jeweils null, wenn unklar.' : ''}${photo ? '- dish_photo: Ist auf einem Bild ein Foto des fertigen Gerichts zu sehen, gib image an (Index des Bildes, 0 = erstes Bild) und box als Begrenzungsrahmen dieses Fotos [ymin, xmin, ymax, xmax] auf einer Skala von 0 bis 1000. Sonst null.' : ''}

Regeln pro Rezept:
- Alles auf Deutsch, auch Titel und Zutatennamen. Eigennamen von Gerichten dürfen bleiben.
- Metrische Einheiten. Rechne cups, oz, lb, sticks und fl oz in g (feste Zutaten) oder ml (Flüssigkeiten) um, °F in °C, inch in cm. Runde auf praxisnahe Werte.
- Erlaubte Einheiten: g, kg, ml, l, EL, TL, Stk, Prise, Bund, Zehe, Dose, Scheibe, Handvoll, Zweig, Blatt. Für ganze Stücke ohne Einheit nimm "Stk".
- servings: Anzahl Personen. Steht sie in der Quelle, übernimm sie mit servings_estimated = false. Sonst schätze sie realistisch aus den Mengen (Hauptgericht etwa 150 bis 250 g Hauptzutat pro Person) und setze servings_estimated = true.
- Mengen: Steht eine Menge in der Quelle${video ? ' (gesagt, eingeblendet oder sichtbar abgemessen)' : ''}, übernimm sie mit amount_estimated = false. Fehlt sie, schätze eine realistische Menge passend zu servings${video ? ' und zu dem, was im Video zu sehen ist' : ''}, und setze amount_estimated = true. Nur bei Salz, Pfeffer und Würzen "nach Geschmack" darf amount null bleiben, dann note = "nach Geschmack".
- total_time_min: Gesamtzeit in Minuten inklusive Ruhe-, Marinier-, Gär- und Backzeiten. Steht sie in der Quelle oder lässt sie sich aus genannten Einzelzeiten summieren, setze total_time_estimated = false. Sonst schätze sie realistisch aus den Arbeitsschritten und setze total_time_estimated = true.${video ? ' Die Länge des Videos ist keine Kochzeit.' : ''}
- ingredients: jede Zutat einmal, mit kurzer id ("z1", "z2", ...) und der Gesamtmenge. group nur bei Komponenten, sonst null. note für Zusätze wie "fein gehackt" oder "zimmerwarm", sonst null. pantry = true für Grundzutaten, die man meist zu Hause hat (Salz, Pfeffer, Zucker, Mehl, neutrales Öl, Olivenöl, Essig, Backpulver, getrocknete Gewürze), sonst false.
- steps: kurze, klare Arbeitsschritte in der richtigen Reihenfolge, im Imperativ. In uses stehen die Zutaten, die in diesem Schritt verwendet werden, jeweils mit der Menge, die in diesem Schritt verwendet wird (bei Aufteilung die Teilmenge, geschätzte Mengen sind erlaubt). Im text markierst du jede Verwendung mit {0}, {1}, ... (Index in uses). Die App ersetzt jeden Platzhalter durch "Menge Einheit Zutat". Beispiel: "{0} in einer Pfanne schmelzen." wird zu "50 g Butter in einer Pfanne schmelzen." Nenne die Zutat deshalb nicht zusätzlich im Text.${video ? ' timestamp_s: Sekunde im Video, an der der Schritt gezeigt wird, sonst null.' : ''}
- gang: genau einer aus ${TAXONOMY.Gang.join(', ')}, nach der Rolle im Menü. Unklar: null.
- hauptzutat: genau einer dieser Werte, wörtlich: ${TAXONOMY.Hauptzutat.map((x) => `"${x}"`).join(', ')}. Gemeint ist die Zutat, die das Gericht prägt. Bei Fleisch- oder Fischgerichten mit viel Gemüse zählt das Fleisch bzw. der Fisch. Passt nichts (z. B. Kuchen): null.
- aufwand: "Alltag" bei überschaubarer aktiver Arbeit und gängigen Techniken, gut unter der Woche machbar. "Projekt" bei vielen Komponenten, anspruchsvoller Technik oder langer aktiver Arbeit. Lange passive Zeiten (Schmoren, Gehen lassen) allein machen kein Projekt.
- vegetarisch: true nur, wenn keine Zutat Fleisch, Geflügel, Fisch, Meeresfrüchte, Fleischbrühe, Gelatine, Schmalz, Fischsauce, Sardellen oder Worcestershiresauce ist. Ei, Milchprodukte und Honig sind erlaubt. Eine optionale Fleischbeilage zählt als nicht vegetarisch. false, wenn eine solche Zutat vorkommt. Unklar: null.
${video ? '' : '- quelle: "Buch" für Kochbuchseiten, "Zeitung" für Zeitungen, Zeitschriften und deren Apps oder Webseiten (z. B. NYT Cooking), "Blog" für sonstige Webseiten und Rezeptportale. Unklar: null.\n'}- tips: wichtige Hinweise zu Technik oder Varianten, höchstens drei kurze Sätze, sonst null.
- Ist gar kein Rezept enthalten, setze is_recipe = false und recipes = [].

Schema:
{"is_recipe": boolean, ${video ? '"channel": string|null, "video_duration_s": number|null' : '"source_name": string|null (Name des Buchs, der Zeitung oder Webseite, wenn erkennbar)'},
 "recipes": [{"title": string, ${video ? '"part_start_s": number|null, "hero_s": number|null, ' : ''}${photo ? '"dish_photo": {"image": number, "box": [number, number, number, number]}|null, ' : ''}
   "servings": number, "servings_estimated": boolean, "total_time_min": number, "total_time_estimated": boolean,
   "ingredients": [{"id": string, "group": string|null, "name": string, "amount": number|null, "amount_estimated": boolean, "unit": string|null, "note": string|null, "pantry": boolean}],
   "steps": [{"text": string, "uses": [{"ref": string, "amount": number|null, "unit": string|null}]${video ? ', "timestamp_s": number|null' : ''}}],
   "gang": string|null, "hauptzutat": string|null, "aufwand": string|null, "vegetarisch": boolean|null${video ? '' : ', "quelle": string|null'}, "tips": string|null}]}`;
}

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => (v === null || v === undefined || v === '' || !isFinite(Number(v)) ? null : Number(v));
const uid = () => Math.random().toString(36).slice(2, 9);

function ytId(str) {
  if (!str) return null;
  const m = String(str).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^ ]*&)?v=|shorts\/|live\/|embed\/|v\/))([\w-]{11})/i);
  return m ? m[1] : null;
}
const yt = (id, f) => `https://i.ytimg.com/vi/${id}/${f}.jpg`;
/* thumb: 0 = Standardbild des Videos, 1-3 = automatische Standbilder von YouTube (ungefähr bei einem Viertel, der Hälfte und drei Vierteln) */
function thumbChain(id, n) {
  const base = [yt(id, 'maxresdefault'), yt(id, 'sddefault'), yt(id, 'hqdefault')];
  return n ? [yt(id, `maxres${n}`), yt(id, `sd${n}`), yt(id, `hq${n}`), ...base] : base;
}
function imgTag(r, extra = '') {
  if (r.image) return `<img ${extra} src="${r.image}" alt="">`;
  if (r.videoId) {
    const chain = thumbChain(r.videoId, r.thumb || 0);
    return `<img class="yt" ${extra} src="${chain[0]}" data-chain="${esc(chain.slice(1).join('|'))}" alt="">`;
  }
  const page = r.pages?.[r.coverPage || 0] || r.input?.pages?.[0];
  if (page) return `<img ${extra} src="${page}" alt="" style="object-position:top">`;
  return `<div class="ph"><span>${esc(r.title || 'Rezept')}</span></div>`;
}
function pickFrame(t, dur) {
  if (t === null || t === undefined || !dur) return 0;
  const pos = [0.25, 0.5, 0.75].map((q) => Math.abs(q * dur - t));
  return pos.indexOf(Math.min(...pos)) + 1;
}
const videoUrl = (id, t) => `https://www.youtube.com/watch?v=${id}${t ? `&t=${Math.floor(t)}s` : ''}`;

function fmtTime(min, est) {
  if (!min) return '';
  const p = est ? '≈ ' : '';
  if (min < 60) return `${p}${Math.round(min)} Min.`;
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return p + (m ? `${h} Std. ${m} Min.` : `${h} Std.`);
}
function fmtStamp(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

/* Mengen: in Basiseinheit rechnen, schön ausgeben */
const FRACTIONS = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
const PLURAL = { Zehe: 'Zehen', Dose: 'Dosen', Scheibe: 'Scheiben', Zweig: 'Zweige', Blatt: 'Blätter', Prise: 'Prisen' };
function toBase(amount, unit) {
  const u = (unit || '').trim();
  if (u === 'kg') return [amount * 1000, 'g'];
  if (u === 'l') return [amount * 1000, 'ml'];
  return [amount, u];
}
function decimal(n, digits) { return String(Number(n.toFixed(digits))).replace('.', ','); }
function fmtAmount(amount, unit) {
  if (amount === null || amount === undefined || !isFinite(amount)) return '';
  let [n, u] = toBase(amount, unit);
  if ((u === 'g' || u === 'ml') && n >= 1000) { n = n / 1000; u = u === 'g' ? 'kg' : 'l'; return `${decimal(n, 2)} ${u}`; }
  let s;
  if (u === 'g' || u === 'ml') s = n < 10 ? decimal(n, 1) : n < 100 ? String(Math.round(n)) : String(Math.round(n / 5) * 5);
  else {
    const q = Math.round(n * 4) / 4;
    if (q === 0) s = decimal(n, 2);
    else {
      const whole = Math.floor(q), frac = Number((q - whole).toFixed(2));
      s = (whole ? String(whole) : '') + (FRACTIONS[frac] || '');
    }
  }
  if (n > 1 && PLURAL[u]) u = PLURAL[u];
  return u ? `${s} ${u}` : s;
}

/* Bilder verkleinern und Gericht-Foto ausschneiden */
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function prepImage(blob, max = 1500) {
  const src = URL.createObjectURL(blob);
  try {
    const img = await loadImg(src);
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(src); }
}
async function cropDish(dataUrl, box) {
  const img = await loadImg(dataUrl);
  const [y0, x0, y1, x1] = box.map((v) => Math.max(0, Math.min(1000, Number(v) || 0)) / 1000);
  if (y1 <= y0 || x1 <= x0) return null;
  let x = x0 * img.naturalWidth, y = y0 * img.naturalHeight, w = (x1 - x0) * img.naturalWidth, h = (y1 - y0) * img.naturalHeight;
  if (w < 120 || h < 80) return null;
  const ratio = 16 / 9;
  if (w / h > ratio) { const nw = h * ratio; x += (w - nw) / 2; w = nw; } else { const nh = w / ratio; y += (h - nh) / 2; h = nh; }
  const outW = Math.min(960, Math.round(w)), outH = Math.round(outW / ratio);
  const c = document.createElement('canvas'); c.width = outW; c.height = outH;
  c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, outW, outH);
  return c.toDataURL('image/jpeg', 0.8);
}

/* ---------- Datenbank (IndexedDB) ---------- */
let _db;
function openDb() {
  if (!_db) _db = new Promise((res, rej) => {
    const r = indexedDB.open('rezeptfang', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('recipes', { keyPath: 'id' }); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
const p = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function os(name, mode = 'readonly') { return (await openDb()).transaction(name, mode).objectStore(name); }
const db = {
  all: async () => p((await os('recipes')).getAll()),
  put: async (r) => p((await os('recipes', 'readwrite')).put(r)),
  del: async (id) => p((await os('recipes', 'readwrite')).delete(id)),
  get: async (k) => p((await os('kv')).get(k)),
  set: async (k, v) => p((await os('kv', 'readwrite')).put(v, k)),
};
/* Geteilte Inhalte, die der Service Worker zwischengespeichert hat */
function inboxTake() {
  return new Promise((res) => {
    const r = indexedDB.open('rf-inbox', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', { autoIncrement: true });
    r.onerror = () => res([]);
    r.onsuccess = () => {
      const tx = r.result.transaction('items', 'readwrite'), st = tx.objectStore('items');
      const g = st.getAll();
      g.onsuccess = () => st.clear();
      tx.oncomplete = () => res(g.result || []);
      tx.onerror = () => res([]);
    };
  });
}

const state = { recipes: [], shopping: [], settings: { apiKey: '', model: DEFAULT_MODEL }, q: '', filter: {}, showFilter: false, servings: {}, done: {}, wake: null };

function migrateTags(r) {
  const out = new Set();
  for (const t of r.tags || []) {
    if (OLD_TAGS[t]) out.add(OLD_TAGS[t]);
    else if (ALL_TAGS.includes(t) && catOf(t) !== 'Kochdauer') out.add(t);
  }
  const tt = timeTag(r.totalTime); if (tt) out.add(tt);
  return ALL_TAGS.filter((t) => out.has(t));
}

async function load() {
  state.recipes = await db.all();
  state.shopping = (await db.get('shopping')) || [];
  state.settings = Object.assign({ apiKey: '', model: DEFAULT_MODEL }, (await db.get('settings')) || {});
  for (const r of state.recipes) {
    let changed = false;
    if (r.status === 'importing' && Date.now() - (r.startedAt || 0) > 11 * 60 * 1000) { r.status = 'error'; r.error = 'Import wurde unterbrochen.'; changed = true; }
    if (!r.kind) { r.kind = r.videoId ? 'youtube' : 'text'; changed = true; }
    if (r.status === 'ok' && !r.tagsV2) { r.tags = migrateTags(r); r.tagsV2 = true; changed = true; }
    if (changed) await db.put(r);
  }
  updateShopCount();
}
async function refresh() { state.recipes = await db.all(); render(); }
function updateShopCount() {
  const open = state.shopping.filter((i) => !i.checked).length;
  const el = $('#shopcount'); el.hidden = !open; el.textContent = open;
}

/* ---------- KI-Import ---------- */
function apiError(status, text) {
  let msg = '';
  try { msg = JSON.parse(text)?.error?.message || ''; } catch (_) { msg = String(text).slice(0, 160); }
  const map = {
    401: 'Der OpenRouter-Schlüssel ist ungültig. Prüfe ihn in den Einstellungen.',
    402: 'Das OpenRouter-Guthaben ist aufgebraucht oder das Tageslimit erreicht.',
    403: 'Anfrage blockiert. Prüfe in der Guardrail, ob Gemini 3.8 Flash und Google AI Studio erlaubt sind.',
    404: 'Kein passender Anbieter gefunden. Videos werden nur über Google AI Studio verarbeitet.',
    408: 'Zeitüberschreitung beim Anbieter. Versuch es noch einmal.',
    413: 'Die Bilder sind zu groß. Versuch es mit weniger Bildern.',
    429: 'Zu viele Anfragen. Warte kurz und versuch es noch einmal.',
  };
  return (map[status] || `Fehler ${status}.`) + (msg ? ` (${msg})` : '');
}

const DROP_MSG = 'Die Verbindung ist während des Imports abgerissen. Bleib in Rezeptfang und lass den Bildschirm an, bis die Karte fertig ist, dann noch einmal versuchen.';

async function askModel(parts, kind, onProgress = () => {}) {
  const body = {
    model: state.settings.model || DEFAULT_MODEL,
    messages: [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: [{ type: 'text', text: buildPrompt(kind) }, ...parts] },
    ],
    provider: { only: ['google-ai-studio'], allow_fallbacks: false },
    response_format: { type: 'json_object' },
    temperature: 0.2,
    max_tokens: 32000,
    reasoning: { effort: 'low' },
    usage: { include: true },
    stream: true,
  };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 600000);
  const send = () => fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', signal: ctrl.signal,
    headers: {
      Authorization: `Bearer ${state.settings.apiKey.trim()}`,
      'Content-Type': 'application/json',
      'HTTP-Referer': location.origin,
      'X-Title': 'Rezeptfang',
    },
    body: JSON.stringify(body),
  });
  let content = '', finish = '', cost = null, broken = false;
  try {
    let res = await send();
    if (!res.ok && res.status === 400) {
      const t = await res.text();
      if (/response_format|json/i.test(t)) { delete body.response_format; res = await send(); }
      else throw new Error(apiError(400, t));
    }
    if (!res.ok) throw new Error(apiError(res.status, await res.text()));
    onProgress('read', 0);
    // Antwort kommt Stück für Stück (Server-Sent Events), das hält die Verbindung am Leben
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          let j; try { j = JSON.parse(payload); } catch (_) { continue; }
          if (j.error) { const err = new Error(apiError(j.error.code || 500, JSON.stringify(j))); err.api = true; throw err; }
          const ch = j.choices?.[0];
          const piece = ch?.delta?.content;
          if (piece) { content += Array.isArray(piece) ? piece.map((c) => c.text || '').join('') : piece; onProgress('write', (content.match(/"title"\s*:/g) || []).length); }
          if (ch?.finish_reason) finish = ch.finish_reason;
          if (j.usage?.cost !== undefined) cost = j.usage.cost;
        }
      }
    } catch (e) {
      if (e.api || e.name === 'AbortError') throw e;
      broken = true; // Abbruch mitten in der Antwort: Teilergebnis unten retten
    }
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Keine fertige Antwort nach 10 Minuten. Versuch es noch einmal.');
    if (e instanceof TypeError) throw new Error(DROP_MSG);
    throw e;
  } finally { clearTimeout(timer); }

  if (!content.trim()) throw new Error(broken ? DROP_MSG : `Das Modell hat leer geantwortet${finish ? ` (${finish})` : ''}. Versuch es noch einmal.`);
  const parsed = parseJson(content);
  if (!parsed) throw new Error(broken ? DROP_MSG : `Die Antwort des Modells war kein gültiges Rezept-Format${/length|max/i.test(finish) ? ', sie wurde abgeschnitten' : ''}. Versuch es noch einmal.`);
  return { data: parsed.data, cost, truncated: parsed.salvaged || broken };
}

function parseJson(txt) {
  let s = String(txt).trim().replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = s.indexOf('{');
  if (a < 0) return null;
  s = s.slice(a);
  const b = s.lastIndexOf('}');
  try { return { data: JSON.parse(s.slice(0, b + 1)), salvaged: false }; } catch (_) {}
  // Abgeschnittene Antwort: alle vollständig gelieferten Rezepte retten
  const k = s.search(/"recipes"\s*:\s*\[/);
  if (k < 0) return null;
  const start = s.indexOf('[', k);
  let depth = 0, inStr = false, escNext = false, lastEnd = -1;
  for (let i = start; i < s.length; i++) {
    const c = s[i];
    if (inStr) { if (escNext) escNext = false; else if (c === '\\') escNext = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') { depth--; if (depth === 1 && c === '}') lastEnd = i; if (depth === 0) break; }
  }
  if (lastEnd < 0) return null;
  try { return { data: JSON.parse(s.slice(0, lastEnd + 1) + ']}'), salvaged: true }; } catch (_) { return null; }
}

async function oembed(url) {
  try {
    const r = await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(url)}`);
    if (!r.ok) return null;
    return await r.json();
  } catch (_) { return null; }
}

function matchTag(cat, v) {
  if (!v) return null;
  const n = (s) => String(s).toLowerCase().replace(/[^a-zäöüß]/g, '');
  return TAXONOMY[cat].find((t) => n(t) === n(v)) || null;
}
function computeTags(r, x, kind) {
  const t = new Set();
  if (kind === 'youtube') t.add('Youtube');
  else { const q = matchTag('Quelle', x.quelle); if (q && q !== 'Youtube') t.add(q); }
  const tt = timeTag(r.totalTime); if (tt) t.add(tt);
  for (const [cat, key] of [['Gang', 'gang'], ['Hauptzutat', 'hauptzutat'], ['Aufwand', 'aufwand']]) { const m = matchTag(cat, x[key]); if (m) t.add(m); }
  if (x.vegetarisch === true) t.add('vegetarisch');
  return ALL_TAGS.filter((k) => t.has(k));
}

function normalizeOne(data, meta, source, kind) {
  const ings = (Array.isArray(data.ingredients) ? data.ingredients : []).map((i, k) => ({
    id: String(i.id || `z${k + 1}`),
    group: i.group ? String(i.group) : null,
    name: String(i.name || '').trim(),
    amount: num(i.amount),
    est: num(i.amount) !== null && i.amount_estimated === true,
    unit: i.unit ? String(i.unit).trim() : '',
    note: i.note ? String(i.note) : '',
    pantry: !!i.pantry,
  })).filter((i) => i.name);
  const seen = new Set();
  for (const i of ings) { while (seen.has(i.id)) i.id += '_'; seen.add(i.id); }
  const ids = new Set(ings.map((i) => i.id));
  const steps = (Array.isArray(data.steps) ? data.steps : []).map((s) => ({
    text: String(s.text || '').trim(),
    uses: (Array.isArray(s.uses) ? s.uses : []).filter((u) => ids.has(String(u.ref))).map((u) => ({ ref: String(u.ref), amount: num(u.amount), unit: u.unit ? String(u.unit).trim() : '' })),
    t: kind === 'youtube' ? num(s.timestamp_s) : null,
  })).filter((s) => s.text);
  if (!ings.length && !steps.length) return null;
  const sv = num(data.servings), tt = num(data.total_time_min);
  const dp = data.dish_photo;
  const r = {
    title: String(data.title || meta?.title || 'Ohne Titel').trim(),
    originalTitle: kind === 'youtube' ? meta?.title || '' : '',
    channel: source,
    servings: sv && sv > 0 ? sv : null,
    servingsEst: !!(sv && sv > 0 && data.servings_estimated === true),
    totalTime: tt && tt > 0 ? Math.round(tt) : null,
    totalTimeEst: !!(tt && tt > 0 && data.total_time_estimated === true),
    ingredients: ings, steps,
    tips: data.tips ? String(data.tips) : '',
    partStart: kind === 'youtube' ? num(data.part_start_s) : null,
    hero: kind === 'youtube' ? num(data.hero_s) : null,
    dishPhoto: dp && Array.isArray(dp.box) && dp.box.length === 4 ? { image: num(dp.image) ?? 0, box: dp.box } : null,
    tagsV2: true,
  };
  r.tags = computeTags(r, data, kind);
  return r;
}

async function normalizeAll(data, meta, input) {
  if (data.is_recipe === false) throw new Error(input.kind === 'youtube' ? 'In diesem Video wurde kein Rezept gefunden.' : 'Darin wurde kein Rezept gefunden.');
  const list = Array.isArray(data.recipes) ? data.recipes : (data.ingredients ? [data] : []);
  const source = input.kind === 'youtube' ? (meta?.author_name || data.channel || '') : (data.source_name ? String(data.source_name) : '');
  const out = list.map((x) => normalizeOne(x, meta, source, input.kind)).filter(Boolean);
  if (!out.length) throw new Error('Das Modell hat kein verwertbares Rezept geliefert.');
  if (input.kind === 'youtube' && out.length > 1) {
    // Jedem Rezept ein eigenes Standbild aus seinem Videoteil, möglichst verschieden
    const dur = num(data.video_duration_s);
    const used = new Set();
    for (const r of out) {
      const t = r.hero ?? r.partStart;
      let n = pickFrame(t, dur);
      if (n && used.has(n) && dur && t !== null) {
        const free = [1, 2, 3].filter((k) => !used.has(k));
        if (free.length) n = free.sort((a, b) => Math.abs(a / 4 * dur - t) - Math.abs(b / 4 * dur - t))[0];
      }
      r.thumb = n; if (n) used.add(n);
    }
  }
  for (const r of out) {
    if (input.kind === 'photo' && r.dishPhoto && input.pages[r.dishPhoto.image]) {
      try { r.image = await cropDish(input.pages[r.dishPhoto.image], r.dishPhoto.box); } catch (_) {}
    }
    delete r.dishPhoto;
  }
  return out;
}

/* Bildschirm während des Imports anlassen, damit Android die App nicht pausiert */
async function holdScreen() {
  if (state.wake) return null;
  try { return await navigator.wakeLock.request('screen'); } catch (_) { return null; }
}

let pendingInput = null;
function needKey(input) {
  if (state.settings.apiKey) return false;
  pendingInput = input; toast('Trag zuerst deinen OpenRouter-Schlüssel ein.'); go('#/einstellungen');
  return true;
}
function siblingsOf(r) {
  return state.recipes.filter((x) => x.id === r.id || (r.batch && x.batch === r.batch) || (r.videoId && x.videoId === r.videoId));
}
function inputOf(r) {
  if (r.kind === 'youtube' && r.videoId) return { kind: 'youtube', videoId: r.videoId };
  if (r.input) return r.input;
  if (r.kind === 'photo' && r.pages?.length) return { kind: 'photo', pages: r.pages };
  if (r.kind === 'text' && r.sourceText) return { kind: 'text', text: r.sourceText };
  return null;
}

async function startImport(raw) {
  const vid = ytId(raw);
  if (!vid) {
    const s = String(raw || '').trim();
    if (s.length >= 120) return startTextImport(s);
    if (/https?:\/\//i.test(s)) { toast('Webseiten kann Rezeptfang nicht direkt lesen. Mach Screenshots vom Rezept und teile sie an Rezeptfang.'); return; }
    toast('Darin steckt kein YouTube-Link.'); return;
  }
  const siblings = state.recipes.filter((r) => r.videoId === vid);
  const done = siblings.filter((r) => r.status === 'ok');
  if (siblings.some((r) => r.status === 'importing')) { toast('Läuft schon.'); return; }
  if (done.length) { toast(done.length > 1 ? `Die ${done.length} Rezepte aus diesem Video hast du schon.` : 'Dieses Rezept hast du schon.'); go(done.length > 1 ? '#/' : `#/r/${done[0].id}`); return; }
  const input = { kind: 'youtube', videoId: vid };
  if (needKey(input)) return;
  await runImport(input, siblings);
}
async function startPhotoImport(blobs) {
  blobs = [...blobs].filter((b) => b && b.size);
  if (!blobs.length) return;
  if (blobs.length > 6) toast('Es werden die ersten 6 Bilder verwendet.');
  const pages = [];
  for (const b of blobs.slice(0, 6)) { try { pages.push(await prepImage(b)); } catch (_) {} }
  if (!pages.length) { toast('Die Bilder konnten nicht gelesen werden.'); return; }
  const input = { kind: 'photo', pages };
  if (needKey(input)) return;
  await runImport(input, []);
}
async function startTextImport(text) {
  text = String(text || '').trim();
  if (text.length < 40) { toast('Der Text ist zu kurz für ein Rezept.'); return; }
  const input = { kind: 'text', text: text.slice(0, 30000) };
  if (needKey(input)) return;
  await runImport(input, []);
}

async function runImport(input, siblings) {
  const backup = JSON.parse(JSON.stringify(siblings.filter((r) => r.status === 'ok')));
  for (const r of siblings) await db.del(r.id);
  const createdAt = siblings[0]?.createdAt || Date.now();
  const rec = { id: newId(), kind: input.kind, videoId: input.videoId || null, input: input.kind === 'youtube' ? null : input, createdAt, tags: [], status: 'importing', startedAt: Date.now(), error: '' };
  await db.put(rec);
  go('#/'); await refresh();
  try { navigator.storage?.persist?.(); } catch (_) {}
  const lock = await holdScreen();
  const label = { youtube: 'Gemini schaut sich das Video an …', photo: 'Gemini liest die Bilder …', text: 'Gemini liest den Text …' }[input.kind];
  const progress = (phase, n) => {
    const el = document.getElementById(`prog-${rec.id}`); if (!el) return;
    el.textContent = phase === 'read' ? label : n > 1 ? `Schreibt Rezept ${n} …` : 'Schreibt das Rezept …';
  };
  try {
    let meta = null, parts;
    if (input.kind === 'youtube') {
      const url = videoUrl(input.videoId);
      parts = [{ type: 'video_url', video_url: { url } }];
      meta = oembed(url);
    } else if (input.kind === 'photo') parts = input.pages.map((u) => ({ type: 'image_url', image_url: { url: u } }));
    else parts = [{ type: 'text', text: `Rezepttext:\n\n${input.text}` }];
    const ai = await askModel(parts, input.kind, progress);
    meta = await meta;
    const list = await normalizeAll(ai.data, meta, input);
    await db.del(rec.id);
    const cost = ai.cost !== null && ai.cost !== undefined ? ai.cost / list.length : null;
    for (let k = 0; k < list.length; k++) {
      await db.put({
        ...list[k], id: k ? newId() : rec.id, batch: rec.id, kind: input.kind,
        videoId: input.videoId || null, pages: input.pages || null, sourceText: input.text || null,
        createdAt: createdAt - k, status: 'ok', importedAt: Date.now(), cost,
        part: list.length > 1 ? k + 1 : 0, partsTotal: list.length,
      });
    }
    await refresh();
    toast((list.length > 1 ? `${list.length} Rezepte gespeichert.` : `„${list[0].title}“ ist gespeichert.`) + (ai.truncated ? ' Die Antwort war abgeschnitten, eventuell fehlen Rezepte. Tippe auf „Neu einlesen“.' : ''));
  } catch (e) {
    if (backup.length) { await db.del(rec.id); for (const b of backup) await db.put(b); toast(e.message); }
    else { rec.status = 'error'; rec.error = e.message; await db.put(rec); }
    await refresh();
  } finally { if (lock) lock.release().catch(() => {}); }
}

/* ---------- Skalierung ---------- */
function factorFor(r) {
  const v = state.servings[r.id];
  if (r.servings) return (v ?? r.servings) / r.servings;
  return v ?? 1;
}
const scale = (a, f) => (a === null || a === undefined ? null : a * f);

function useFor(r, use) {
  const ing = r.ingredients.find((i) => i.id === use.ref);
  if (!ing) return null;
  let amount = use.amount, unit = use.unit;
  if (amount === null) {
    const count = r.steps.filter((s) => s.uses.some((u) => u.ref === use.ref)).length;
    if (count === 1) { amount = ing.amount; unit = ing.unit; }
  }
  return { ing, amount, unit: unit || ing.unit, est: !!ing.est };
}

/* ---------- Ansichten ---------- */
function setTab(name) {
  document.querySelectorAll('.tabs a').forEach((a) => a.setAttribute('aria-current', a.dataset.tab === name ? 'page' : 'false'));
  $('#fab').hidden = name !== 'list';
}
function go(h) { if (location.hash === h) render(); else location.hash = h; }

function render() {
  const parts = (location.hash || '#/').slice(2).split('/');
  const view = $('#view');
  if (parts[0] === 'r' && parts[1]) {
    const r = state.recipes.find((x) => x.id === parts[1]);
    if (!r || r.status !== 'ok') { go('#/'); return; }
    setTab('');
    view.innerHTML = parts[2] === 'bearbeiten' ? viewEdit(r) : viewDetail(r);
    window.scrollTo(0, 0);
    return;
  }
  if (parts[0] === 'einkauf') { setTab('shop'); view.innerHTML = viewShop(); return; }
  if (parts[0] === 'einstellungen') { setTab('settings'); view.innerHTML = viewSettings(); return; }
  setTab('list');
  view.innerHTML = viewList();
  renderFeed();
}

function viewList() {
  const ok = state.recipes.filter((r) => r.status === 'ok');
  const present = new Set(ok.flatMap((r) => r.tags || []));
  const active = Object.entries(state.filter);
  const cats = Object.keys(TAXONOMY).filter((c) => TAXONOMY[c].some((t) => present.has(t)));
  return `
  <header class="masthead"><h1 class="wordmark">Rezeptfang<span>${ok.length ? `${ok.length} ${ok.length === 1 ? 'Rezept' : 'Rezepte'} in deiner Sammlung` : 'Rezepte aus Videos, Büchern und Screenshots'}</span></h1></header>
  ${ok.length ? `<div class="searchbox"><div class="searchrow"><label class="sr" for="q">Suchen</label><input id="q" type="search" placeholder="Gericht oder Zutat suchen" value="${esc(state.q)}" autocomplete="off">
    ${cats.length ? `<button class="filterbtn" data-act="togglefilter" aria-expanded="${state.showFilter}">Filter${active.length ? ` <b>${active.length}</b>` : ''}</button>` : ''}</div>
    ${active.length && !state.showFilter ? `<div class="chips">${active.map(([c, t]) => `<button class="chip" data-act="unfilter" data-cat="${esc(c)}" aria-pressed="true">${esc(t)} ×</button>`).join('')}</div>` : ''}
    ${state.showFilter ? `<div class="fpanel">${cats.map((c) => `<div class="frow"><span class="flabel">${esc(c)}</span><div class="chips">${TAXONOMY[c].filter((t) => present.has(t)).map((t) => `<button class="chip" data-act="filter" data-cat="${esc(c)}" data-tag="${esc(t)}" aria-pressed="${state.filter[c] === t}">${esc(t)}</button>`).join('')}</div></div>`).join('')}
      <div class="rowbtns">${active.length ? '<button class="btn small ghost" data-act="clearfilter">Filter zurücksetzen</button>' : ''}<button class="btn small" data-act="togglefilter">Fertig</button></div></div>` : ''}
  </div>` : ''}
  <div class="feed" id="feed"></div>`;
}

function matches(r, q) {
  if (!q) return true;
  const hay = [r.title, r.originalTitle, r.channel, ...(r.tags || []), ...(r.ingredients || []).map((i) => i.name)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}
const passesFilter = (r) => Object.values(state.filter).every((t) => (r.tags || []).includes(t));

function renderFeed() {
  const feed = $('#feed'); if (!feed) return;
  const list = state.recipes.slice().sort((a, b) => b.createdAt - a.createdAt);
  const pending = list.filter((r) => r.status !== 'ok');
  const shown = list.filter((r) => r.status === 'ok' && matches(r, state.q) && passesFilter(r));
  if (!list.length) {
    feed.innerHTML = `<div class="empty"><h2>Noch keine Rezepte.</h2>
      <p>Teile ein Kochvideo aus der YouTube-App, Screenshots eines Rezepts oder Fotos von Kochbuchseiten an Rezeptfang. Zutaten und Schritte landen dann hier.</p>
      <p>${state.settings.apiKey ? '' : 'Vorher einmal in den Einstellungen deinen OpenRouter-Schlüssel eintragen.'}</p></div>`;
    return;
  }
  const what = { youtube: 'aus dem Video', photo: 'aus den Bildern', text: 'aus dem Text' };
  const pendingHtml = pending.map((r) => `
    <div class="card"><div class="thumb">${imgTag(r)}
      <div class="state">${r.status === 'importing'
        ? `<strong>Rezept wird ${what[r.kind] || ''} gelesen</strong><span id="prog-${r.id}">Verbinde mit OpenRouter …</span><span style="font-size:13px;opacity:.8">Das kann bis zu einige Minuten dauern. Bitte in der App bleiben.</span><div class="bar"><i></i></div>`
        : `<strong>Import fehlgeschlagen</strong><span>${esc(r.error)}</span>
           <div class="rowbtns"><button class="btn small primary" data-act="retry" data-id="${r.id}">Erneut versuchen</button><button class="btn small ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" data-act="remove" data-id="${r.id}">Entfernen</button></div>`}
      </div></div></div>`).join('');
  const cards = shown.map((r) => {
    const tags = (r.tags || []).filter((t) => catOf(t) !== 'Quelle' && catOf(t) !== 'Kochdauer');
    return `
    <a class="card" href="#/r/${r.id}">
      <div class="thumb">${imgTag(r, 'loading="lazy"')}${r.totalTime ? `<span class="badge">${fmtTime(r.totalTime, r.totalTimeEst)}</span>` : ''}</div>
      <h2>${esc(r.title)}</h2>
      <p class="meta">${esc(r.channel || { photo: 'Aus Fotos', text: 'Aus Text' }[r.kind] || '')}</p>
      ${tags.length ? `<div class="minitags">${tags.map((t) => `<span class="minitag">${esc(t)}</span>`).join('')}</div>` : ''}
    </a>`;
  }).join('');
  const none = !shown.length && (state.q || Object.keys(state.filter).length) ? `<div class="empty"><h2>Nichts gefunden.</h2><p>Probier einen anderen Suchbegriff oder setz die Filter zurück.</p></div>` : '';
  feed.innerHTML = pendingHtml + cards + none;
}

function stepHtml(r, s, f) {
  const uses = s.uses.map((u) => useFor(r, u)).filter(Boolean);
  const label = (x) => {
    const a = fmtAmount(scale(x.amount, f), x.unit);
    return `<span class="ing${x.est ? ' est' : ''}">${esc(a ? `${x.est ? '≈ ' : ''}${a} ${x.ing.name}` : x.ing.name)}</span>`;
  };
  const used = new Set();
  let text = esc(s.text).replace(/\{(\d+)\}/g, (m, k) => { const x = uses[+k]; if (!x) return ''; used.add(+k); return label(x); });
  const rest = uses.filter((_, k) => !used.has(k));
  if (rest.length) text += ` <span style="white-space:normal">${rest.map(label).join(' ')}</span>`;
  return text;
}

function viewDetail(r) {
  const f = factorFor(r);
  const cur = r.servings ? Math.round(r.servings * f * 100) / 100 : f;
  const noteless = (i) => !/geschmack/i.test(i.note);
  const missing = r.ingredients.filter((i) => i.amount === null && !i.pantry && noteless(i)).length;
  const estimated = r.ingredients.filter((i) => i.est).length;
  const estParts = [r.servingsEst ? 'die Personenzahl' : '', r.totalTimeEst ? 'die Gesamtzeit' : '', estimated ? (estimated === 1 ? 'eine Zutatenmenge' : `${estimated} Zutatenmengen`) : ''].filter(Boolean);
  const estText = estParts.length ? estParts.slice(0, -1).join(', ') + (estParts.length > 1 ? ' und ' : '') + estParts[estParts.length - 1] : '';
  const groups = [];
  for (const i of r.ingredients) { let g = groups.find((x) => x.name === (i.group || '')); if (!g) groups.push(g = { name: i.group || '', items: [] }); g.items.push(i); }
  const done = state.done[r.id] || new Set();
  const isVideo = !!r.videoId;
  return `
  <article>
    <div class="hero">${imgTag(r)}<a class="back" href="#/" aria-label="Zurück zur Übersicht">‹</a></div>
    <h1 class="dtitle">${esc(r.title)}</h1>
    <div class="dmeta">${r.channel ? `<span>${esc(r.channel)}</span>` : ''}${r.totalTime ? `<span>${fmtTime(r.totalTime, r.totalTimeEst)}</span>` : ''}${isVideo ? `<a href="${videoUrl(r.videoId)}" target="_blank" rel="noopener">Video ansehen</a>` : ''}${r.pages?.length ? '<a href="#originale">Originalseiten</a>' : ''}</div>
    ${(r.tags || []).length ? `<div class="tagrow">${r.tags.map((t) => `<span class="minitag">${esc(t)}</span>`).join('')}</div>` : ''}
    ${estText ? `<p class="notice">${estText.replace(/^./, (c) => c.toUpperCase())} ${estParts.length > 1 || estimated > 1 ? 'sind' : 'ist'} geschätzt und mit ≈ markiert. Korrigieren kannst du das unter „Bearbeiten“.</p>` : ''}
    ${missing ? `<p class="notice">${missing === 1 ? 'Bei einer Zutat' : `Bei ${missing} Zutaten`} fehlt die Menge. Du kannst sie unter „Bearbeiten“ ergänzen.</p>` : ''}
    ${r.partsTotal > 1 ? `<p class="dmeta" style="margin-top:10px">Rezept ${r.part} von ${r.partsTotal} aus ${isVideo ? 'diesem Video' : 'dieser Quelle'}${isVideo && r.partStart ? `, <a href="${videoUrl(r.videoId, r.partStart)}" target="_blank" rel="noopener">ab ${fmtStamp(r.partStart)}</a>` : ''}</p>` : ''}

    <div class="servings" role="group" aria-label="Personen">
      <button data-act="less" data-id="${r.id}" aria-label="Weniger">−</button>
      <div class="val"><strong>${r.servings ? `${r.servingsEst ? '≈ ' : ''}${String(cur).replace('.', ',')}` : `× ${String(cur).replace('.', ',')}`}</strong><span>${r.servings ? `${cur === 1 ? 'Person' : 'Personen'}${r.servingsEst ? ' (geschätzt)' : ''}` : 'Menge'}</span></div>
      <button data-act="more" data-id="${r.id}" aria-label="Mehr">+</button>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="toshop" data-id="${r.id}">Auf die Einkaufsliste</button>
      <button class="btn ghost" data-act="wake">${state.wake ? 'Bildschirm darf ausgehen' : 'Bildschirm anlassen'}</button>
    </div>

    <h2 class="section-h">Zutaten</h2>
    ${groups.map((g) => `${g.name ? `<h3 class="group-h">${esc(g.name)}</h3>` : ''}<ul class="ings">${g.items.map((i) => `
      <li><span class="amt${i.est ? ' est' : ''}">${i.est && i.amount !== null ? '≈ ' : ''}${esc(fmtAmount(scale(i.amount, f), i.unit))}</span>
      <span>${esc(i.name)}${i.note ? ` <span class="note">${esc(i.note)}</span>` : ''}${i.est ? '<span class="missing">geschätzt</span>' : ''}${i.amount === null && !i.pantry && noteless(i) ? '<span class="missing">Menge fehlt</span>' : ''}</span></li>`).join('')}</ul>`).join('')}

    <h2 class="section-h">Zubereitung</h2>
    <ol class="steps">${r.steps.map((s, k) => `
      <li class="${done.has(k) ? 'done' : ''}" data-act="step" data-id="${r.id}" data-k="${k}"><div><p>${stepHtml(r, s, f)}</p>
      ${isVideo && s.t !== null && s.t !== undefined ? `<a class="ts" href="${videoUrl(r.videoId, s.t)}" target="_blank" rel="noopener">Im Video ab ${fmtStamp(s.t)}</a>` : ''}</div></li>`).join('')}</ol>

    ${r.tips ? `<h2 class="section-h">Tipps</h2><p class="tips">${esc(r.tips)}</p>` : ''}
    ${r.pages?.length ? `<details class="pages" id="originale"><summary>Originalseiten (${r.pages.length})</summary>${r.pages.map((u) => `<img src="${u}" alt="Originalseite" loading="lazy">`).join('')}</details>` : ''}

    <div class="foot">
      <a class="btn ghost" href="#/r/${r.id}/bearbeiten">Bearbeiten</a>
      ${inputOf(r) ? `<button class="btn ghost" data-act="reimport" data-id="${r.id}">Neu einlesen</button>` : ''}
      <button class="btn ghost danger" data-act="delete" data-id="${r.id}">Löschen</button>
    </div>
    ${r.cost ? `<p class="cost">Import hat ${decimal(r.cost, 3)} $ gekostet.</p>` : ''}
  </article>`;
}

    : (r.pages || []).map((u, n) => ({ key: `p${n}`, html: `<img src="${u}" alt="" style="object-position:top">`, on: !r.image && (r.coverPage || 0) === n }));

      <label class="field"><span>Gesamtzeit (Min.)${r.totalTimeEst ? ' (geschätzt)' : ''}</span><input name="totalTime" type="number" inputmode="numeric" min="0" value="${r.totalTime ?? ''}"></label>

    ${thumbOpts.length > 1 ? `<div class="panel"><h3>Vorschaubild</h3>

      <div class="thumbpick">${thumbOpts.map((o) => `<button type="button" data-act="thumbpick" data-n="${o.key}" aria-pressed="${o.on}">${o.html}</button>`).join('')}</div>

    <div class="panel"><h3>Tags</h3>
      ${Object.entries(TAXONOMY).filter(([cat]) => cat !== 'Kochdauer').map(([cat, tags]) => `<div class="group-h">${esc(cat)}</div><div class="tagpick">${tags.map((t) => `<button type="button" class="chip" data-act="tagtoggle" data-tag="${esc(t)}" aria-pressed="${(r.tags || []).includes(t)}">${esc(t)}</button>`).join('')}</div>`).join('')}
      <small style="color:var(--muted)">Pro Kategorie ein Tag. Die Kochdauer ergibt sich aus der Gesamtzeit.</small>
    </div>

    <div class="panel"><h3>Zutaten</h3>
      <div style="display:grid;grid-template-columns:64px 64px 1fr 36px;gap:6px;font-size:12.5px;color:var(--muted)"><span>Menge</span><span>Einheit</span><span>Zutat</span><span></span></div>
      <div id="eding">${r.ingredients.map(ingRow).join('')}</div>
      <button type="button" class="btn small" data-act="adding">Zutat hinzufügen</button>
      <small style="display:block;color:var(--muted);margin-top:8px">Mengen gelten für ${r.servings ? `${String(r.servings).replace('.', ',')} Personen` : 'die Originalmenge'}. Gestrichelte Felder sind geschätzt. Änderst du eine Menge, gilt sie als bestätigt.</small>
    </div>

    <div class="panel"><h3>Schritte</h3>
      <small style="color:var(--muted)">{0}, {1} … sind Platzhalter für die Zutatenmengen dieses Schritts. Lass sie stehen oder lösch sie mitsamt der Zutat.</small>
      ${r.steps.map((s, k) => {
        const names = s.uses.map((u, n) => { const i = r.ingredients.find((x) => x.id === u.ref); return i ? `{${n}} = ${i.name}` : ''; }).filter(Boolean).join(', ');
        return `<div class="ed-step"><textarea name="step${k}">${esc(s.text)}</textarea>${names ? `<small style="color:var(--muted)">${esc(names)}</small>` : ''}</div>`;
      }).join('')}
    </div>

    <label class="field"><span>Tipps</span><textarea name="tips">${esc(r.tips)}</textarea></label>
    <div class="rowbtns" style="margin:18px 0">
      <button class="btn primary" type="submit">Änderungen speichern</button>
      <a class="btn ghost" href="#/r/${r.id}">Abbrechen</a>
    </div>
  </form>`;
}
function ingRow(i) {
  return `<div class="ed-ing" data-iid="${esc(i.id)}" data-est="${i.est ? 1 : ''}" data-orig="${i.amount ?? ''}">
    <input aria-label="Menge" data-f="amount" inputmode="decimal" value="${i.amount ?? ''}" ${i.est ? 'style="border-style:dashed"' : ''}>
    <input aria-label="Einheit" data-f="unit" value="${esc(i.unit)}">
    <input aria-label="Zutat" data-f="name" value="${esc(i.name)}">
    <button type="button" class="x" data-act="deling" aria-label="Zutat entfernen">×</button></div>`;
}

/* Einkaufsliste */
function viewShop() {
  const items = state.shopping;
  const buy = items.filter((i) => !i.pantry), pantry = items.filter((i) => i.pantry);
  const li = (i) => `<li class="${i.checked ? 'checked' : ''}"><input type="checkbox" id="s${i.id}" data-act="check" data-id="${i.id}" ${i.checked ? 'checked' : ''}>
    <label for="s${i.id}"><span class="amt">${i.est && i.amount !== null ? '≈ ' : ''}${esc(fmtAmount(i.amount, i.unit))}</span><span>${esc(i.name)}<span class="from">${esc((i.from || []).join(', '))}</span></span></label></li>`;
  const sortItems = (a) => a.slice().sort((x, y) => (x.checked - y.checked) || x.name.localeCompare(y.name, 'de'));
  return `
  <h1 class="pagetitle">Einkaufsliste</h1>
  <p class="sub">${items.length ? `${items.filter((i) => !i.checked).length} von ${items.length} noch offen` : 'Füge Zutaten aus einem Rezept hinzu oder schreib selbst etwas dazu.'}</p>
  <form class="addrow" id="shopadd"><label class="sr" for="shopnew">Eintrag</label><input class="inp" id="shopnew" placeholder="z. B. 2 Zitronen" autocomplete="off"><button class="btn primary" type="submit">Dazu</button></form>
  ${buy.length ? `<ul class="shop">${sortItems(buy).map(li).join('')}</ul>` : ''}
  ${pantry.length ? `<h2 class="group-h" style="margin-top:24px">Vorrat prüfen</h2><ul class="shop">${sortItems(pantry).map(li).join('')}</ul>` : ''}
  ${items.length ? `<div class="rowbtns" style="margin-top:22px"><button class="btn ghost" data-act="clearchecked">Abgehakte entfernen</button><button class="btn ghost danger" data-act="clearall">Liste leeren</button></div>` : ''}`;
}

async function addToShop(r) {
  const f = factorFor(r);
  for (const i of r.ingredients) {
    const [amount, unit] = i.amount === null ? [null, i.unit] : toBase(i.amount * f, i.unit);
    const key = `${i.name.toLowerCase().trim()}|${unit}`;
    const hit = state.shopping.find((s) => !s.checked && s.key === key);
    if (hit) {
      hit.amount = hit.amount === null || amount === null ? (hit.amount ?? amount) : hit.amount + amount;
      hit.est = hit.est || i.est;
      if (!hit.from.includes(r.title)) hit.from.push(r.title);
    } else state.shopping.push({ id: uid(), key, name: i.name, amount, unit, est: i.est, pantry: i.pantry, checked: false, from: [r.title] });
  }
  await db.set('shopping', state.shopping); updateShopCount();
  toast('Zutaten sind auf der Einkaufsliste.');
}

/* Einstellungen */
function viewSettings() {
  const s = state.settings;
  return `
  <h1 class="pagetitle">Einstellungen</h1>
  <form id="setform" class="panel">
    <h3>OpenRouter</h3>
    <label class="field"><span>API-Schlüssel</span><input name="apiKey" type="password" value="${esc(s.apiKey)}" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
      <small>Bleibt nur auf diesem Gerät gespeichert.</small></label>
    <label class="field"><span>Modell</span><input name="model" value="${esc(s.model)}" spellcheck="false">
      <small>Standard: ${DEFAULT_MODEL}. Muss YouTube-Links über Google AI Studio verstehen.</small></label>
    <div class="rowbtns"><button class="btn primary" type="submit">Speichern</button><button class="btn ghost" type="button" data-act="testkey">Schlüssel prüfen</button></div>
    <div class="status" id="keystatus"></div>
  </form>
  <div class="panel">
    <h3>Sicherung</h3>
    <p class="sub" style="margin:4px 0 12px">Deine Rezepte liegen nur in diesem Browser. Speichere ab und zu eine Sicherung, etwa in Google Drive.</p>
    <div class="rowbtns"><button class="btn" data-act="export">Sicherung speichern</button><label class="btn ghost" for="importfile">Sicherung laden</label><input type="file" id="importfile" accept="application/json,.json" hidden></div>
    <div class="status" id="backupstatus"></div>
  </div>
  <p class="sub" style="font-size:13px">${state.recipes.filter((r) => r.status === 'ok').length} Rezepte gespeichert. Rezeptfang Version ${APP_VERSION}.</p>`;
}

/* ---------- Ereignisse ---------- */
function rerenderKeepScroll() { const y = scrollY; render(); scrollTo(0, y); }

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const r = id ? state.recipes.find((x) => x.id === id) : null;
  switch (act) {
    case 'togglefilter': state.showFilter = !state.showFilter; render(); break;
    case 'filter': {
      const c = el.dataset.cat, t = el.dataset.tag;
      if (state.filter[c] === t) delete state.filter[c]; else state.filter[c] = t;
      render(); break;
    }
    case 'unfilter': delete state.filter[el.dataset.cat]; render(); break;
    case 'clearfilter': state.filter = {}; render(); break;
    case 'retry': {
      if (!r) break;
      if (r.kind === 'youtube' && r.videoId) { await db.del(r.id); state.recipes = state.recipes.filter((x) => x.id !== r.id); startImport(videoUrl(r.videoId)); }
      else if (r.input) { if (!needKey(r.input)) runImport(r.input, [r]); }
      break;
    }
    case 'remove': if (r) { await db.del(r.id); refresh(); } break;
    case 'less': case 'more': {
      const stepSize = r.servings ? (r.servings >= 2 ? 1 : 0.5) : 0.5;
      const curVal = r.servings ? (state.servings[r.id] ?? r.servings) : (state.servings[r.id] ?? 1);
      state.servings[r.id] = Math.max(stepSize, curVal + (act === 'more' ? stepSize : -stepSize));
      rerenderKeepScroll(); break;
    }
    case 'toshop': if (r) addToShop(r); break;
    case 'wake': await toggleWake(); rerenderKeepScroll(); break;
    case 'step': {
      if (e.target.closest('a')) return;
      const set = state.done[id] || (state.done[id] = new Set()); const k = +el.dataset.k;
      set.has(k) ? set.delete(k) : set.add(k); el.classList.toggle('done'); break;
    }
    case 'reimport': {
      const input = r && inputOf(r);
      if (!input) break;
      const sib = siblingsOf(r).filter((x) => x.status === 'ok');
      const msg = sib.length > 1 ? `Alle ${sib.length} Rezepte aus dieser Quelle neu einlesen? Deine Änderungen gehen dabei verloren.` : 'Rezept neu einlesen? Deine Änderungen gehen dabei verloren.';
      if (confirm(msg) && !needKey(input)) runImport(input, siblingsOf(r));
      break;
    }
    case 'delete': if (r && confirm(`„${r.title}“ löschen?`)) { await db.del(r.id); await refresh(); go('#/'); toast('Gelöscht.'); } break;
    case 'tagtoggle': {
      const t = el.dataset.tag, on = el.getAttribute('aria-pressed') !== 'true';
      if (on && catOf(t) !== 'Ernährung') el.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
      el.setAttribute('aria-pressed', String(on)); break;
    }
    case 'thumbpick': el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); break;
    case 'adding': $('#eding').insertAdjacentHTML('beforeend', ingRow({ id: 'n' + uid(), amount: null, unit: '', name: '' })); break;
    case 'deling': el.closest('.ed-ing').remove(); break;
    case 'check': {
      const it = state.shopping.find((i) => i.id === id); if (!it) break;
      it.checked = el.checked; await db.set('shopping', state.shopping); updateShopCount(); render(); break;
    }
    case 'clearchecked': state.shopping = state.shopping.filter((i) => !i.checked); await db.set('shopping', state.shopping); updateShopCount(); render(); break;
    case 'clearall': if (confirm('Ganze Einkaufsliste leeren?')) { state.shopping = []; await db.set('shopping', []); updateShopCount(); render(); } break;
    case 'testkey': testKey(); break;
    case 'export': exportBackup(); break;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { state.q = e.target.value; renderFeed(); }
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'importfile' && e.target.files[0]) importBackup(e.target.files[0]);
  if (e.target.id === 'photoin' && e.target.files.length) {
    const files = [...e.target.files]; e.target.value = '';
    $('#adddlg').close(); startPhotoImport(files);
  }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.id === 'setform') {
    e.preventDefault();
    state.settings.apiKey = f.apiKey.value.trim();
    state.settings.model = f.model.value.trim() || DEFAULT_MODEL;
    await db.set('settings', state.settings);
    $('#keystatus').innerHTML = '<span class="ok">Gespeichert.</span>';
    if (pendingInput && state.settings.apiKey) {
      const input = pendingInput; pendingInput = null;
      if (input.kind === 'youtube') startImport(videoUrl(input.videoId)); else runImport(input, []);
    }
  }
  if (f.id === 'editform') {
    e.preventDefault();
    const r = state.recipes.find((x) => x.id === f.dataset.id); if (!r) return;
    const el = f.elements;
    r.title = el.title.value.trim() || r.title;
    r.channel = el.channel.value.trim();
    const sv = num(el.servings.value.replace(',', '.'));
    if (sv !== r.servings) r.servingsEst = false;
    r.servings = sv && sv > 0 ? sv : null;
    const tt = num(el.totalTime.value);
    if (tt !== r.totalTime) r.totalTimeEst = false;
    r.totalTime = tt && tt > 0 ? tt : null;
    const tp = f.querySelector('.thumbpick [aria-pressed="true"]');
    if (tp) {
      const k = tp.dataset.n;
      if (k[0] === 'v') { r.thumb = +k.slice(1); r.image = null; }
      else if (k[0] === 'p') { r.image = null; r.coverPage = +k.slice(1); }
    }
    const picked = [...f.querySelectorAll('.tagpick .chip[aria-pressed="true"]')].map((c) => c.dataset.tag);
    const tTag = timeTag(r.totalTime);
    r.tags = ALL_TAGS.filter((t) => picked.includes(t) || t === tTag);
    const old = new Map(r.ingredients.map((i) => [i.id, i]));
    r.ingredients = [...f.querySelectorAll('.ed-ing')].map((row) => {
      const g = (k) => row.querySelector(`[data-f="${k}"]`).value.trim();
      const prev = old.get(row.dataset.iid) || {};
      const amount = num(g('amount').replace(',', '.'));
      const est = !!row.dataset.est && amount !== null && String(amount) === row.dataset.orig;
      return { id: row.dataset.iid, group: prev.group || null, name: g('name'), amount, est, unit: g('unit'), note: prev.note || '', pantry: !!prev.pantry };
    }).filter((i) => i.name);
    const ids = new Set(r.ingredients.map((i) => i.id));
    r.steps = r.steps.map((s, k) => ({ ...s, text: (el[`step${k}`]?.value ?? s.text).trim(), uses: s.uses.filter((u) => ids.has(u.ref)) })).filter((s) => s.text);
    r.tips = el.tips.value.trim();
    delete state.servings[r.id];
    await db.put(r); await refresh(); go(`#/r/${r.id}`); toast('Gespeichert.');
  }
  if (f.id === 'shopadd') {
    e.preventDefault();
    const v = $('#shopnew').value.trim(); if (!v) return;
    const m = v.match(/^(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|EL|TL|Stk|Prise|Bund|Dose)?\s+(.+)$/i);
    const item = m ? { amount: Number(m[1].replace(',', '.')), unit: m[2] || '', name: m[3] } : { amount: null, unit: '', name: v };
    state.shopping.push({ id: uid(), key: `${item.name.toLowerCase()}|${item.unit}`, ...item, pantry: false, checked: false, from: [] });
    await db.set('shopping', state.shopping); updateShopCount(); render(); $('#shopnew').focus();
  }
});

/* Vorschaubilder: fehlende Auflösungen liefert YouTube als 120px-Platzhalter, dann nächste Quelle probieren */
function nextThumb(img) {
  const rest = (img.dataset.chain || '').split('|').filter(Boolean);
  if (!rest.length) return;
  img.src = rest.shift(); img.dataset.chain = rest.join('|');
}
document.addEventListener('load', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.classList.contains('yt') && img.naturalWidth <= 120) nextThumb(img);
}, true);
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.classList.contains('yt')) nextThumb(img);
}, true);

/* Hinzufügen-Dialog */
$('#fab').addEventListener('click', () => { $('#addurl').value = ''; $('#addtext').value = ''; $('#textbox').hidden = true; $('#adddlg').showModal(); });
$('#dlgclose').addEventListener('click', () => $('#adddlg').close());
$('#pastebtn').addEventListener('click', async () => {
  try { $('#addurl').value = await navigator.clipboard.readText(); } catch (_) { toast('Kein Zugriff auf die Zwischenablage. Füge den Link per Gedrückthalten ein.'); }
});
$('#urlgo').addEventListener('click', () => { const v = $('#addurl').value; $('#adddlg').close(); startImport(v); });
$('#texttoggle').addEventListener('click', () => { $('#textbox').hidden = !$('#textbox').hidden; if (!$('#textbox').hidden) $('#addtext').focus(); });
$('#textgo').addEventListener('click', () => { const v = $('#addtext').value; $('#adddlg').close(); startTextImport(v); });

/* Bildschirm anlassen beim Kochen */
async function toggleWake() {
  try {
    if (state.wake) { await state.wake.release(); state.wake = null; return; }
    state.wake = await navigator.wakeLock.request('screen');
    state.wake.addEventListener('release', () => { if (!document.hidden) state.wake = null; });
  } catch (_) { toast('Dein Browser kann den Bildschirm nicht anlassen.'); state.wake = null; }
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && state.wake) { try { state.wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
});

/* Schlüssel prüfen */
async function testKey() {
  const st = $('#keystatus');
  const key = $('#setform').apiKey.value.trim();
  if (!key) { st.innerHTML = '<span class="err">Bitte zuerst einen Schlüssel eintragen.</span>'; return; }
  st.textContent = 'Prüfe …';
  try {
    const r = await fetch('https://openrouter.ai/api/v1/key', { headers: { Authorization: `Bearer ${key}` } });
    if (!r.ok) { st.innerHTML = `<span class="err">${esc(apiError(r.status, await r.text()))}</span>`; return; }
    const d = (await r.json()).data || {};
    const used = d.usage != null ? `${decimal(d.usage, 2)} $ verbraucht` : '';
    const left = d.limit_remaining != null ? `, ${decimal(d.limit_remaining, 2)} $ Limit übrig` : '';
    st.innerHTML = `<span class="ok">Schlüssel funktioniert${used ? `: ${used}${left}` : ''}.</span>`;
  } catch (_) { st.innerHTML = '<span class="err">Keine Verbindung zu OpenRouter.</span>'; }
}

/* Sicherung */
function exportBackup() {
  const data = { app: 'rezeptfang', version: 2, exportedAt: new Date().toISOString(), recipes: state.recipes.filter((r) => r.status === 'ok'), shopping: state.shopping };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `rezeptfang-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importBackup(file) {
  const st = $('#backupstatus');
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'rezeptfang' || !Array.isArray(data.recipes)) throw new Error();
    for (const r of data.recipes) {
      if (!r || !r.id) continue;
      if (!r.kind) r.kind = r.videoId ? 'youtube' : 'text';
      if (!r.tagsV2) { r.tags = migrateTags(r); r.tagsV2 = true; }
      await db.put(r);
    }
    if (Array.isArray(data.shopping) && confirm('Auch die Einkaufsliste aus der Sicherung übernehmen?')) { state.shopping = data.shopping; await db.set('shopping', state.shopping); updateShopCount(); }
    state.recipes = await db.all();
    st.innerHTML = `<span class="ok">${data.recipes.length} Rezepte geladen.</span>`;
  } catch (_) { st.innerHTML = '<span class="err">Diese Datei ist keine Rezeptfang-Sicherung.</span>'; }
}

/* ---------- Start ---------- */
window.addEventListener('hashchange', render);
(async function init() {
  await load();
  const params = new URLSearchParams(location.search);
  const fromShare = params.has('share');
  const legacy = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ');
  if (location.search) history.replaceState(null, '', location.pathname + (location.hash || '#/'));
  render();
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (fromShare) {
    const items = await inboxTake();
    for (const it of items) {
      const files = (it.files || []).filter((x) => x && x.size);
      if (files.length) await startPhotoImport(files);
      else if (it.text) await startImport(it.text);
    }
  } else if (legacy) startImport(legacy);
})();
</script>
